# 流水线配置 —— Agent 通过改这里做实验（CLAUDE.md R5、R7）
#
# 工兵只能做两件事：在 modules/ 下新建零件文件、改这个文件。
# 所有参数必须从这里读，代码里出现写死的数字一律打回（R7）。
#
# 键名约定（工兵的 config_patch 只允许这三个前缀）：
#   features.*   用哪些特征、加特征类零件的开关与参数
#   model.*      模型结构与超参
#   train.*      训练过程（早停、损失权重…）
#
# 白名单之外的键（data / eval / 数据规模）由人和调度器管 —— 它们一旦被改，
# 各轮的分数就不可比了，等于偷偷换考卷。

# ── 数据 ──────────────────────────────────────────────
# 路径由执行器在运行时注入，这里不写死（R7）。这一节工兵不许动。
data: {}

# ── 特征 ──────────────────────────────────────────────
features:
  # 当前进模型的字段。这是 Agent 最常改的东西之一 ——
  # 医生诊断出「特征没组合起来」「历史行为没用上」时，改的就是这里。
  base_fields: ["101", "121", "122", "124", "125", "126", "127", "128", "129",
                "205", "206", "207", "216", "301"]

  # ── 下面每个零件块的约定 ──
  #   enabled: true  才会被加载
  #   impl:          指向实现文件（modules/ 下），**启用了却没写 impl 会直接报错**
  #                  以前没有加载机制时，改这里等于没改：训练结果纹丝不动，
  #                  却被记成"这个方案没用"。现在宁可当场炸，也不假装跑过。
  #   其余键         零件自己读，代码里不许写死（R7）
  # 零件新长出来的特征列会自动进特征表，不用手动改 base_fields。

  # 多值字段（109_14/110_14/127_14/150_14/210）和 4 个交叉字段
  # 需要专门的编码零件才能用，目前未启用 ——
  # 这正是 baseline 身上那个洞（见 docs/baseline笔记.md 洞1）
  多值字段接回来:
    enabled: false
    pooling: weighted_mean        # weighted_mean / mean / max
    fields: ["109_14", "110_14", "127_14", "150_14"]
    cross_fields: ["508", "509", "702", "853"]

  类目兜底:
    enabled: false
    category_field: "206"
    K: 20                          # 出现次数低于 K 的商品借用类目 embedding

  目标编码:
    enabled: false
    fields: ["101", "205", "206"]
    smoothing: 20                  # 平滑强度，越大越靠近全局先验
    n_folds: 5                     # 折外计算，防泄漏（R2）

# ── 模型 ──────────────────────────────────────────────
model:
  name: lightgbm                   # lightgbm 走 GBDT 那条路；
                                   # 其他名字一律走深度路径（harness/deep.py），
                                   # 那时必须同时给 impl 指向模型零件
  # impl: modules/models/mlp.py    # ← 深度模型必填。零件实现 modules/base.py 的 ModelOp
  deep:                            # 深度路径的训练超参数（只对非 lightgbm 生效）
    epochs: 5                      # 上限 50
    batch_size: 4096
    learning_rate: 0.001
    embed_dim: 16
    weight_decay: 0.00001
  embed_dim: 16                    # 深度模型的 embedding 维度
  lightgbm:
    n_estimators: 120
    num_leaves: 31
    learning_rate: 0.05
    min_data_in_leaf: 20
    feature_fraction: 1.0
  # 购买塔通常要比点击塔小 —— 转化正样本太少，容量大必然过拟合
  cvr_overrides:
    n_estimators: 60
    num_leaves: 15

# ── 训练过程 ──────────────────────────────────────────
train:
  seed: 20260827                   # 必须固定并记录（R8）
  # 数据规模（小份/中份/大份/全量）不在这里 —— 它由调度器按升降级规则决定。
  # 放进来会被工兵改，那样各轮的分数就不可比了。

  # ⚠️ 下面每一块，执行器要么真的兑现，要么**启用时当场报错**。
  #    绝不接受了却无视 —— 那会让工兵白改一轮、分数纹丝不动，
  #    复盘官据此判「猜错了」，把一张好卡片拉黑。见 harness/executor.py:check_supported

  # ✅ 生效：LightGBM 原生早停
  early_stopping:
    enabled: false
    patience: 3
    inner_holdout_frac: 0.1        # 从**训练集内部**再切一小块当早停的裁判
    # 为什么不用开发集当裁判：final_judge 走同一条训练路径只换被评的数据，
    # 早停若盯着"当前在评的那份"，锁定集大考时就会拿锁定集决定停在哪 ——
    # 既违反 R3，也让大考评的模型跟当轮选中的不是同一个（R2/R9）。
    monitor: mean_auc              # 留给深度模型路径；LightGBM 用内置早停
    min_delta: 0.0005              # 与 R11 的门槛对齐
    mode: max

  # ✅ 生效：负样本抽样 + 概率还原
  negative_sampling:
    enabled: false
    keep_ratio: 0.3                # 负样本保留比例；正样本永远全留
    recalibrate: true              # 预测后把概率还原回真实尺度
    # 注意：还原是单调变换，**不改变 AUC**。它修的是 logloss 和预测均值的尺度；
    # 负采样真正的收益是训练更快、购买塔正负比更平衡。

  # ⛔ 启用会当场报错：要按 epoch 累积权重平均，LightGBM 没有 epoch 循环可挂
  swa:
    enabled: false
    start_epoch_ratio: 0.75

  # ⛔ strategy 不是 fixed 会当场报错：动态权重是给「一个模型同时学两件事」用的，
  #    这里点击塔和购买塔是两个独立的 LightGBM，权重无处可施
  loss_weight:
    strategy: fixed                # fixed（其余需要多任务模型：ESMM/MMOE 那条路）
    ctr: 1.0
    cvr: 1.0

# ── 评估（口径固定，不许改，见 CLAUDE.md 第五节）──────
eval:
  ctr_scope: all_impressions       # 点击 AUC：全部曝光
  cvr_scope: clicked_only          # 购买 AUC：仅 click=1 子集
  also_report_cvr_on_all: true     # Q1 未定，全曝光口径也算也记
