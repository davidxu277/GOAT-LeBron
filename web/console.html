<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOAT-LeBron 控制台</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#2E2C28; --soft:#6F6B63; --faint:#9C978D;
  --line:#E8E4DC; --accent:#7C9885; --accent-soft:#EDF2EE;
  --warm:#C7A17A; --warm-soft:#F7F0E7; --bad:#B5766B; --bad-soft:#F7EBE8;
}
*{box-sizing:border-box}
html,body{height:100%; overflow:hidden}
body{margin:0; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.7;
  font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif; letter-spacing:.01em}
.app{height:100vh; display:flex; flex-direction:column; padding:1.1rem 1.4rem 1.2rem; gap:.9rem}
.top{display:flex; align-items:baseline; justify-content:space-between; flex:none}
h1{font-size:1.15rem; font-weight:700; margin:0; letter-spacing:.02em}
.top p{margin:0; font-size:.78rem; color:var(--faint)}
.main{flex:1; display:grid; grid-template-columns:20rem 1fr; gap:.9rem; min-height:0}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:1rem 1.1rem; display:flex; flex-direction:column; min-height:0}
.card h2{font-size:.82rem; font-weight:600; margin:0 0 .8rem; color:var(--soft);
  letter-spacing:.03em; flex:none}
label{display:block; font-size:.75rem; color:var(--faint); margin:.55rem 0 .2rem}
input,select{width:100%; font:inherit; font-size:.8rem; padding:.4rem .6rem;
  border:1px solid var(--line); border-radius:7px; background:#FCFBF9; color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.row{display:flex; gap:.5rem}
.picker{display:flex; gap:.35rem}
.picker input{flex:1; min-width:0; direction:rtl; text-align:left}
.pick{flex:none; padding:.4rem .6rem; font-size:.75rem; white-space:nowrap}
.btns{display:flex; gap:.5rem; margin-top:.9rem}
button{font:inherit; font-size:.8rem; padding:.45rem .9rem; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:#FCFBF9; color:var(--ink); transition:.15s}
button:hover:not(:disabled){background:#F3F1EC}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.45; cursor:not-allowed}
.scroll{overflow-y:auto; min-height:0; flex:1; padding-right:.3rem}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:#E0DCD3; border-radius:99px}
.right{display:grid; grid-template-rows:auto 1fr; gap:.9rem; min-height:0}
.checks{display:flex; flex-direction:column; gap:.35rem}
.check{display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem; padding:.35rem .6rem;
  border-radius:7px; background:#FAF9F6}
.check.ok{color:var(--soft)} .check.ok .i{color:var(--accent)}
.check.warn{background:var(--warm-soft); color:#7A5C3C} .check.warn .i{color:var(--warm)}
.check.bad{background:var(--bad-soft); color:#8A4F44} .check.bad .i{color:var(--bad)}
.i{flex:none; font-weight:600}
.stats{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.7rem}
.chip{font-size:.73rem; background:#F5F3EF; border:1px solid var(--line);
  padding:.1rem .5rem; border-radius:5px; color:var(--soft); font-variant-numeric:tabular-nums}
.chip b{font-weight:500; color:var(--faint); margin-right:.25rem}
.stream{font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:.74rem;
  line-height:1.65; color:var(--soft); white-space:pre-wrap; word-break:break-word}
.stream .ev{padding:.15rem 0; border-bottom:1px solid #F2F0EB}
.stream .ts{color:var(--faint); margin-right:.5rem}
.stream .role{color:var(--accent); font-weight:600}
.metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:.6rem}
.metric{background:#FAF9F6; border:1px solid var(--line); border-radius:9px; padding:.6rem .8rem}
.metric b{display:block; font-size:1.15rem; font-weight:600; font-variant-numeric:tabular-nums}
.metric span{font-size:.7rem; color:var(--faint)}
.metric.null b{color:var(--faint); font-size:.9rem}
.empty{color:var(--faint); font-size:.8rem; margin:0}
.status{display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--soft)}
.dot{width:.45rem; height:.45rem; border-radius:50%; background:var(--faint)}
.dot.run{background:var(--accent); animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
</style></head>
<body><div class="app">
  <header class="top">
    <div><h1>GOAT-LeBron 控制台</h1>
    <p>本地数据 → 预检 → 真实训练 → 成绩单</p></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">待命</span></div>
  </header>

  <div class="main">
    <section class="card">
      <h2>数据与运行设置</h2>
      <div class="scroll">
        <label>训练集（含标签）</label>
        <div class="picker"><input id="train" placeholder="点右侧选择，或直接粘贴路径">
          <button class="pick" data-for="train" data-title="选择训练集">选择…</button></div>
        <label>验证集特征（不含标签）</label>
        <div class="picker"><input id="valx" placeholder="点右侧选择，或直接粘贴路径">
          <button class="pick" data-for="valx" data-title="选择验证集特征">选择…</button></div>
        <label>验证集标签（评分用，不给模型）</label>
        <div class="picker"><input id="valy" placeholder="点右侧选择，或直接粘贴路径">
          <button class="pick" data-for="valy" data-title="选择验证集标签">选择…</button></div>
        <div class="row">
          <div style="flex:1"><label>数据规模</label>
            <select id="fidelity">
              <option>小份</option><option>中份</option><option>大份</option>
              <option selected>全量</option>
            </select></div>
          <div style="flex:1"><label>随机种子</label>
            <input id="seed" value="20260827"></div>
        </div>
        <div class="btns">
          <button id="btnCheck">预检</button>
          <button id="btnRun" class="primary" disabled>开始训练</button>
        </div>
        <p class="empty" style="margin-top:.6rem">预检通过才能开始训练。数据不出本机。</p>
      </div>
    </section>

    <div class="right">
      <section class="card" style="max-height:16rem">
        <h2>预检结果</h2>
        <div class="scroll" id="checkBox"><p class="empty">填好路径后点「预检」。</p></div>
      </section>
      <section class="card">
        <h2>运行进度与成绩单</h2>
        <div class="scroll" id="runBox"><p class="empty">还没有运行记录。</p></div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let offset = 0, timer = null;

function paths(){
  return {train:$('train').value.trim(), val_features:$('valx').value.trim(),
          val_labels:$('valy').value.trim(), fidelity:$('fidelity').value,
          seed:$('seed').value};
}

// 「选择…」调服务器弹出 Finder —— 浏览器拿不到真实路径，但服务器在本机上
document.querySelectorAll('.pick').forEach(btn => {
  btn.onclick = async () => {
    const target = $(btn.dataset.for);
    btn.disabled = true; btn.textContent = '选择中…';
    try{
      const r = await fetch('/api/pick', {method:'POST',
        body: JSON.stringify({title: btn.dataset.title})});
      const d = await r.json();
      if(d.path) target.value = d.path;
    } finally {
      btn.disabled = false; btn.textContent = '选择…';
    }
  };
});

$('btnCheck').onclick = async () => {
  const p = paths();
  if(!p.train || !p.val_features){ alert('至少要填训练集和验证集特征路径'); return; }
  $('checkBox').innerHTML = '<p class="empty">读取中…</p>';
  const r = await fetch('/api/preflight', {method:'POST', body:JSON.stringify(p)});
  const d = await r.json();
  const icon = {ok:'✓', warn:'!', bad:'✕'};
  $('checkBox').innerHTML =
    '<div class="checks">' + d.checks.map(c =>
      `<div class="check ${c.level}"><span class="i">${icon[c.level]}</span><span>${c.text}</span></div>`
    ).join('') + '</div>' +
    '<div class="stats">' + Object.entries(d.stats||{}).map(([k,v]) =>
      `<span class="chip"><b>${k}</b>${typeof v==='number'?v.toLocaleString():v}</span>`
    ).join('') + '</div>';
  // 只有致命问题才拦住训练；黄色警告放行（小数据也允许跑通链路）
  $('btnRun').disabled = (d.level === 'bad');
  if(d.level === 'bad') $('btnRun').title = '预检有致命问题，先修数据';
};

$('btnRun').onclick = async () => {
  const p = paths();
  if(!p.val_labels){ alert('评分需要验证集标签文件'); return; }
  $('runBox').innerHTML = '<div class="stream" id="stream"></div>';
  $('btnRun').disabled = true;
  await fetch('/api/run', {method:'POST', body:JSON.stringify(p)});
  setRunning(true);
  timer = setInterval(poll, 700);
};

function setRunning(on){
  $('dot').className = 'dot' + (on ? ' run' : '');
  $('statusText').textContent = on ? '运行中' : '待命';
}

async function poll(){
  const r = await fetch('/api/events?offset=' + offset);
  const d = await r.json();
  offset = d.offset;
  const s = $('stream');
  if(s) d.events.filter(e => e.type !== 'llm_delta').forEach(e => {
    const div = document.createElement('div');
    div.className = 'ev';
    div.innerHTML = `<span class="ts">${e.ts}</span>` +
      (e.role ? `<span class="role">${e.role}</span> ` : '') +
      (e.name ? `<b>${e.name}</b> ` : '') +
      (e.detail || e.text || e.type);
    s.appendChild(div); s.scrollTop = s.scrollHeight;
  });
  if(!d.running){
    clearInterval(timer); setRunning(false);
    const st = await (await fetch('/api/status')).json();
    if(st.last) showResult(st.last);
    $('btnRun').disabled = false;
  }
}

function showResult(last){
  if(!last.ok){
    $('runBox').innerHTML = `<div class="check bad"><span class="i">✕</span><span>${last.error}</span></div>`;
    return;
  }
  const v = last.report['验证集'] || {}, t = last.report['训练集'] || {};
  const fmt = x => (x === null || x === undefined) ? null : (+x).toFixed(4);
  const cells = [
    ['点击 AUC', fmt(v['点击分'])], ['购买 AUC', fmt(v['购买分'])],
    ['训练集点击', fmt(t['点击分'])], ['训练集购买', fmt(t['购买分'])],
    ['验证行数', (v['总行数']||0).toLocaleString()],
    ['转化数', (v['转化数']||0).toLocaleString()],
  ];
  let html = '<div class="metrics">' + cells.map(([k, val]) =>
    `<div class="metric${val===null?' null':''}"><b>${val===null?'算不出':val}</b><span>${k}</span></div>`
  ).join('') + '</div>';
  if(v['购买分可信度警告'])
    html += `<div class="check warn" style="margin-top:.7rem"><span class="i">!</span><span>${v['购买分可信度警告']}</span></div>`;
  html += `<p class="empty" style="margin-top:.7rem">耗时 ${last.seconds.toFixed(1)} 秒 · 完整成绩单已写入日志</p>`;
  $('runBox').insertAdjacentHTML('afterbegin', html);
}
</script>
</body></html>
