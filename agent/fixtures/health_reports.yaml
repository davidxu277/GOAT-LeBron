# 5 份假成绩单 —— 用来离线调「医生」的提示词
#
# 格式跟真成绩单一样（goat_executor._health_report + diagnostics.build）：
# 验证集 / 训练集 各带 GAUC、nDCG@5、主分；分组证据块摊平在顶层。
# 数字是按 KuaiRand-Pure 的量级编的，不是真跑出来的。
#
# expect 是标准答案，只给人看，不会喂给模型。里面「」括起来的必须是现行病名
# （tests/test_offline_speaks_kuairand.py 盯着）。
# 第 4、5 份是陷阱题：看医生会不会硬编病、会不会拿小样本的假数字当证据。

正常起步:
  expect: >
    应查出「冷门视频排不上去」（最低桶比最高桶低 0.073，且占 22%）和
    「历史行为没用上」（实际特征里只有当次曝光的 id 字段）；
    可能还有「学得不够」（最佳轮次 = 最后一轮，训练验证只差 0.015）。
    「新用户不会做」差距虽大但只占 1.6%，严重度应该给低。
