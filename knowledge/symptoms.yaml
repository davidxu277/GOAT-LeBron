# 病名清单 —— 医生和药方卡之间的"暗号"
#
# 这些 id 是全项目唯一的病名来源：
#   · 医生输出的 symptom 只能是这里的 id
#   · 药方卡的 treats 字段只能填这里的 id
#
# 代码必须强制校验（详见 CLAUDE.md）：
#   1. 医生输出不在此列表 → 拒收，重问一次
#   2. 任一卡片贴了此列表外的标签 → 启动时直接报错，不许运行
#
# ── 08-31 大改：任务从 AliCCP 换成 KuaiRand-Pure ──
#
# 旧任务：曝光 → 点击 → 转化的漏斗，两个 AUC（CTR / CVR）
# 新任务：用户内排序（within-user ranking），标签 long_view，
#         指标 GAUC + nDCG@5，主分 = 两者平均
#
# 删掉的 4 个病（漏斗没了，它们在新任务上不存在）：
#   转化样本偏差   —— 只有一个标签，没有"点了才能观察到"这回事
#   两个任务打架   —— 只有一个任务
#   特征没组合起来 —— FM 本身就在做二阶交叉，被模型结构消掉了
#   把握不准（校准）—— GAUC 和 nDCG 都只看**排序**，跟概率绝对值无关。
#                    这条在 AliCCP 上是真病，在这里是彻底的伪病，留着只会浪费轮次。
#
# ── 08-31 晚 修两类错，都是真跑一场之后暴露的 ──
#
# ① 基线数字写错了，而且刚好把结论写反。
#    「学得不够」原文写「官方基线 GAUC 0.6016」—— 0.6016 是 **primary**，
#    不是 GAUC。官方 FM 的真值是 GAUC 0.6674 / nDCG@5 0.5357 / primary 0.60155。
#    结果那一场跑出 GAUC 0.6638（**低于**基线 0.0036），医生拿着 0.6016 这把
#    错尺子算出"明显高于基线"，把唯一该报的病判成了没病。
#
#    教训：**基线数字一律不写死在这里**。成绩单里有「官方Validation基线」和
#    「相对官方基线」两块，那是当次运行真读到的值。写死的常数会跟数据、
#    跟队友的配置慢慢走岔，而且走岔时不会报错，只会安静地把结论带偏。
#
# ② 判据指向的字段成绩单里根本没有。
#    12 个病里 6 个要的是**分组之后**的数字，而 KuaiRand 成绩单当时只有验证集
#    三个总分。医生一轮一轮回「需要训练集指标，这里没有」「需要分桶数据，没有」
#    ——它没做错，是我们没给证据。整场跑下来军师和工兵一次都没被叫起来。
#    现在 diagnostics.py 把这些块补进成绩单了，下面每条 needs 都写明**去看哪个字段**。
#
# detect 里的数字是建议初值。成绩单若带「噪声带」字段，那是当次实测值，
# 比这里写死的数字更准，医生应当优先信它。

version: "0.3"
updated: "2026-08-31"
task: "KuaiRand-Pure · 用户内 long_view 排序 · GAUC + nDCG@5"

symptoms:

  - id: 冷门视频排不上去
    detect: 看「按视频曝光次数分组」。最低桶（曝光<10次）比最高桶（曝光>1000次）
            的 GAUC 低多少算病，优先看该桶自己的噪声带；没有这个字段时退回 0.03，
            且最低桶占比 > 20%。分组里带「说明」字段的表示样本量不够、不出分，
            那一桶不能用来下结论。
    needs: 成绩单「按视频曝光次数分组」—— 4 个桶各自的 GAUC / nDCG@5 / 占比 / 正样本数
    core: true

  - id: Top5排不上去
    detect: GAUC 与 nDCG@5 背离 —— 看「相对官方基线」里两者各自的差：
            GAUC 不低于基线、nDCG@5 却低于基线，或两者差距比上一版扩大。
            整体排序对但**前 5 个位置**没排好，而主分里 nDCG@5 占一半。
    needs: 成绩单「相对官方基线」的 GAUC / nDCG@5 两项差值 + 最近几轮记录里上一版的值
    core: true

  - id: 排序损失不匹配
    detect: 训练用的是逐条打分的损失（pointwise，如 BCE），而评测是用户内排序。
            分数绝对值再准，用户内的相对次序也未必对。
            看「训练诊断 → 实际生效配置」里的损失/模型设置。
    needs: 成绩单「训练诊断」里的「实际生效配置」与「装上的零件」
    core: true

  - id: 在背题
    detect: 「训练集」主分 −「验证集」主分 > 0.04（有实测噪声带时以它为准）。
            差距 > 0.15 是 CLAUDE.md 明写的危险信号，代码会强制拦截，
            这时不许返回 no_finding。
            注意「训练集」块带「口径提醒」：它走的是推理路径，若用过折外编码
            会略高于模型真正见过的分数，差距刚过 0.04 一点点时别急着下结论。
    needs: 成绩单「训练集」与「验证集」各自的 GAUC / nDCG@5 / 主分
    core: true

  - id: 新用户不会做
    detect: 看「按用户是否见过分组」。"训练集里没见过的"那堆 GAUC 比"见过的"
            低 0.03 以上。KuaiRand 按日期切分，冷启动用户是真实存在的一大块。
    needs: 成绩单「按用户是否见过分组」—— 两堆各自的 GAUC / nDCG@5 / 占比
    core: true

  - id: 时间漂移
    detect: 训练 4/08–4/21、验证 4/22–4/28，**按日期切**，分布本来就会漂。
            看「验证集按日期分组」：分数随日期单调下滑就是漂移。
            或验证分明显低于训练分、但训练分本身也不高（不像过拟合）。
    needs: 成绩单「验证集按日期分组」的逐日主分 + 「训练集」「验证集」各自的分数
    core: false

  - id: 退化用户占比高
    detect: 官方评测里 GAUC **只统计 0 < 正例数 < 曝光数 的用户**，
            而 nDCG 对所有用户都算、零正例记 0。这类用户占比一高，
            两个指标会朝相反方向动 —— 判定：「用户构成」里
            GAUC参与用户占比 < 0.6。
    needs: 成绩单「用户构成」—— GAUC参与用户数 / 总用户数 / 零正例用户占比
    core: false

  - id: 历史行为没用上
    detect: 用户历史行为特征完全未使用，或只做了计数汇总
            （只保留"看了多少"，丢掉"看的是哪些"）。
            看「训练诊断 → 实际特征」里到底有哪些列进了模型。
    needs: 成绩单「训练诊断」里的「实际特征」与「装上的零件」
    core: false

  - id: 学得不够
    detect: 看「相对官方基线」里的判断字段。两个指标都低于官方基线
            （基线值成绩单里的「官方Validation基线」直接给了，**不要用记忆中的数字**），
            且「训练诊断 → 每轮训练记录」里最佳轮次等于最后一轮（还没学完就停了）。
            只满足前一半也值得报，严重度按差多少给。
    needs: 成绩单「相对官方基线」+「官方Validation基线」+「训练诊断 → 每轮训练记录」的最佳轮次与总轮数
    core: false

  - id: 训练太慢
    detect: 单次运行耗时 ÷ 总预算 > 5%
    needs: 成绩单「运行预算」里的本次耗时与剩余秒数
    core: false

  - id: 结果不稳
    detect: 同一配置换 3 个随机种子，primary 标准差 > 0.002
    needs: 多种子运行结果（只在关键节点做；成绩单只有一个种子时判不了，别硬判）
    core: false

  - id: 数据对不上
    detect: 看「预测健康」：行数一致为 false；或 NaN或Inf数 > 0；
            或「去重后取值数」极小（模型对所有行输出同一个分，排序完全无效）。
    needs: 成绩单「预测健康」—— 预测行数 / 目标行数 / NaN或Inf数 / 去重后取值数
    core: true
