# 病名清单 —— 医生和药方卡之间的"暗号"
#
# 这 12 个 id 是全项目唯一的病名来源：
#   · 医生输出的 symptom 只能是这里的 id
#   · 药方卡的 treats 字段只能填这里的 id
#
# 代码必须强制校验（详见 CLAUDE.md）：
#   1. 医生输出不在此列表 → 拒收，重问一次
#   2. 任一卡片贴了此列表外的标签 → 启动时直接报错，不许运行
#
# detect 里的数字是建议初值，可以调，但必须成员2 和成员3 一起改。

version: "0.1"
updated: "2026-08-26"

symptoms:

  - id: 转化样本偏差
    detect: 结构性判断，不看数字。购买模型若只用 click=1 的样本训练，即判为严重。
    needs: 当前训练使用的样本范围
    core: true

  - id: 冷门商品学不动
    detect: 商品按训练集出现次数分 4 桶（<10 / 10-100 / 100-1000 / >1000）。
            最低桶比最高桶低 0.03 以上，且最低桶样本占比 > 20%。
    needs: 4 个桶各自的两个 AUC + 各桶样本占比
    core: true

  - id: 在背题
    detect: 训练集 AUC − 验证集 AUC > 0.04
    needs: 训练集上的两个 AUC
    core: true

  - id: 新用户不会做
    detect: 验证集分成"训练集里见过的 ID"和"没见过的"两堆，
            没见过的那堆低 0.03 以上。
    needs: 两堆各自的两个 AUC + 占比
    core: true

  - id: 学得不够
    detect: 两个 AUC 都低于基线，且最佳轮次等于最后一轮（说明还没学完就停了）。
    needs: 每轮 AUC、最佳轮次、总轮次
    core: false

  - id: 两个任务打架
    detect: 与上一版比，一个 AUC 涨 0.002 以上，同时另一个跌 0.001 以上。
    needs: 与上一版的 AUC 差值
    core: false

  - id: 特征没组合起来
    detect: 数据自带的 4 个交叉特征（508 / 509 / 702 / 853）未被使用；
            或模型结构中没有任何做特征交叉的部件。
    needs: 当前使用的特征清单、当前模型结构清单
    core: false

  - id: 把握不准
    detect: 预测概率分 10 档，每档"预测均值"与"实际发生率"之差加权求和 > 0.05。
            注意：这个病不影响 AUC 排序，只影响后续融合与阈值决策。
    needs: 10 档各自的预测均值与实际发生率
    core: false

  - id: 历史行为没用上
    detect: 三种情况任一成立即判有病 ——
            ① 多值字段（109_14 / 110_14 / 127_14 / 150_14 / 210）完全未使用；
            ② 只做了权重求和（只保留"逛了多少"，丢掉"逛的是哪些"）；
            ③ 多值字段被压扁成单值（只保留最后一个）。
    needs: 当前特征清单 + 每个多值字段的处理方式
    core: false

  - id: 训练太慢
    detect: 单次运行耗时 ÷ 总预算 > 5%
    needs: 本次训练耗时、总预算
    core: false

  - id: 结果不稳
    detect: 同一配置换 3 个随机种子，AUC 标准差 > 0.002
    needs: 多种子运行结果（只在关键节点做）
    core: false

  - id: 数据对不上
    detect: 某特征在训练集与验证集的分布差异过大；
            或空值 / 异常值比例 > 1%；
            或出现 click=0 且 conversion=1 的非法组合。
    needs: 训练与验证的特征分布对比、空值率、非法组合计数
    core: false
