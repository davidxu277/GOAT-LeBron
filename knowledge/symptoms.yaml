# 病名清单 —— 医生和药方卡之间的"暗号"
#
# 这些 id 是全项目唯一的病名来源：
#   · 医生输出的 symptom 只能是这里的 id
#   · 药方卡的 treats 字段只能填这里的 id
#
# 代码必须强制校验（详见 CLAUDE.md）：
#   1. 医生输出不在此列表 → 拒收，重问一次
#   2. 任一卡片贴了此列表外的标签 → 启动时直接报错，不许运行
#
# ── 08-31 大改：任务从 AliCCP 换成 KuaiRand-Pure ──
#
# 旧任务：曝光 → 点击 → 转化的漏斗，两个 AUC（CTR / CVR）
# 新任务：用户内排序（within-user ranking），标签 long_view，
#         指标 GAUC + nDCG@5，主分 = 两者平均
#
# 删掉的 4 个病（漏斗没了，它们在新任务上不存在）：
#   转化样本偏差   —— 只有一个标签，没有"点了才能观察到"这回事
#   两个任务打架   —— 只有一个任务
#   特征没组合起来 —— FM 本身就在做二阶交叉，被模型结构消掉了
#   把握不准（校准）—— GAUC 和 nDCG 都只看**排序**，跟概率绝对值无关。
#                    这条在 AliCCP 上是真病，在这里是彻底的伪病，留着只会浪费轮次。
#
# detect 里的数字是建议初值。成绩单若带「噪声带」字段，那是当次实测值，
# 比这里写死的数字更准，医生应当优先信它。

version: "0.2"
updated: "2026-08-31"
task: "KuaiRand-Pure · 用户内 long_view 排序 · GAUC + nDCG@5"

symptoms:

  - id: 冷门视频排不上去
    detect: 视频按训练集曝光次数分 4 桶（<10 / 10-100 / 100-1000 / >1000）。
            最低桶比最高桶的 GAUC 低多少算病，优先看该桶自己的噪声带；
            没有这个字段时退回 0.03，且最低桶样本占比 > 20%。
    needs: 4 个桶各自的 GAUC 与 nDCG@5 + 各桶样本占比与正样本数
    core: true

  - id: Top5排不上去
    detect: GAUC 与 nDCG@5 背离 —— GAUC 不低于官方基线、nDCG@5 却低于它，
            或两者差距比上一版扩大。整体排序对但**前 5 个位置**没排好，
            而主分里 nDCG@5 占一半。
    needs: 两个指标各自的值、与官方基线的差、与上一版的差
    core: true

  - id: 排序损失不匹配
    detect: 训练用的是逐条打分的损失（pointwise，如 BCE），
            而评测是用户内排序。分数绝对值再准，用户内的相对次序也未必对。
    needs: 当前损失函数类型、训练目标
    core: true

  - id: 在背题
    detect: 训练集 primary − 验证集 primary > 0.04（有实测噪声带时以它为准）。
            差距 > 0.15 是 CLAUDE.md 明写的危险信号，代码会强制拦截。
    needs: 训练集与验证集各自的 GAUC / nDCG@5
    core: true

  - id: 新用户不会做
    detect: 验证集用户分成"训练集里见过的"和"没见过的"两堆，
            没见过的那堆 GAUC 低 0.03 以上。
            KuaiRand 按日期切分，冷启动用户是真实存在的一大块。
    needs: 两堆各自的 GAUC / nDCG@5 + 占比
    core: true

  - id: 时间漂移
    detect: 训练 4/08–4/21、验证 4/22–4/28，**按日期切**，分布本来就会漂。
            验证分明显低于训练分，但训练分本身也不高（不像过拟合），
            或验证集内按日期分段看分数单调下滑。
    needs: 训练/验证各自的分数、验证集按日期分段的分数
    core: false

  - id: 退化用户占比高
    detect: 官方评测里 GAUC **只统计 0 < 正例数 < 曝光数 的用户**，
            而 nDCG 对所有用户都算、零正例记 0。
            这类用户占比一高，两个指标会朝相反方向动 ——
            判定：GAUC 参与用户数 ÷ 总用户数 < 0.6。
    needs: GAUC 参与用户数、总用户数、零正例用户占比
    core: false

  - id: 历史行为没用上
    detect: 用户历史行为特征完全未使用，或只做了计数汇总
            （只保留"看了多少"，丢掉"看的是哪些"）。
    needs: 当前特征清单 + 历史类字段的处理方式
    core: false

  - id: 学得不够
    detect: 两个指标都低于官方基线（GAUC 0.6016 / nDCG@5 见 baseline_scores.json），
            且最佳轮次等于最后一轮（还没学完就停了）。
    needs: 每轮的验证分、最佳轮次、总轮次
    core: false

  - id: 训练太慢
    detect: 单次运行耗时 ÷ 总预算 > 5%
    needs: 本次训练耗时、总预算
    core: false

  - id: 结果不稳
    detect: 同一配置换 3 个随机种子，primary 标准差 > 0.002
    needs: 多种子运行结果（只在关键节点做）
    core: false

  - id: 数据对不上
    detect: 预测行数与目标 split 不一致；或 user_id 对不齐；
            或预测里出现 NaN / Inf；或某特征在训练与验证的分布差异过大。
    needs: 预测行数与目标行数、用户对齐情况、空值与异常值统计
    core: true
