编号: 时间衰减加权
名字: 越近的行为权重越高

治哪些毛病: [时间漂移, Top5排不上去]
属于哪个环节: 数据 + 训练策略

为什么管用: |
  训练集是 4/08–4/21，验证集是 4/22–4/28 —— 按日期切的。
  用户口味、平台推什么、什么内容在流行，两周之内都会变。
  把两周前的样本和昨天的样本一视同仁，等于让模型去拟合一个已经过去的分布。
  给每条样本按"距离验证期有多远"打个衰减权重，越近的越重，
  模型就更贴近它真正要预测的那段时间。

预计能提多少: {GAUC: 0.004, nDCG@5: 0.006}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 数据里要有可用的时间列（date / timestamp）
靠不靠谱: 0.6

怎么实现: |
  从数据的日期列算出每条样本距训练期末尾多少天 d，
  权重 w = decay ** d（decay 从配置读，典型 0.9~0.99，d 以天计）。
  训练时把 w 乘进这条样本的损失。
  ⚠️ 只用训练集自己的日期算，不许看验证集的日期范围（R2）。
  配置：train.time_decay.enabled / train.time_decay.rate

失败信号: |
  · 分数不动 —— 多半是 decay 设得太接近 1（等于没衰减），先试 0.9 看有没有反应
  · 分数明显下降 —— decay 太小，等于把大半训练数据扔了，样本量不够了
  · 训练集分数涨、验证集反而跌 —— 权重让模型过拟合到了训练期末尾那几天

出处: |
  时间衰减样本加权是工业推荐系统的常规做法，用于对抗概念漂移
