编号: 时间衰减加权
名字: 越近的行为权重越高

治哪些毛病: [时间漂移, Top5排不上去]
# 「模型」写在前面：工兵要写的是一个模型零件（只加一个 loss 方法），按环节取范文时拿到的是 mlp.py
属于哪个环节: 模型 + 训练策略

为什么管用: |
  训练集是 4/08–4/21，验证集是 4/22–4/28 —— 按日期切的。
  用户口味、平台推什么、什么内容在流行，两周之内都会变。
  把两周前的样本和昨天的样本一视同仁，等于让模型去拟合一个已经过去的分布。
  给每条样本按"距离验证期有多远"打个衰减权重，越近的越重，
  模型就更贴近它真正要预测的那段时间。

预计能提多少: {GAUC: 0.004, nDCG@5: 0.006}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 数据里要有时间列 —— 有：流水线的数据里带 date（按天，没有更细的时间）
靠不靠谱: 0.6

怎么实现: |
  新写一个模型零件（modules/models/ 下的新文件），继承 modules/models/mlp.py 的
  MLPModel，只加一个 loss(self, out, batch, torch) 方法；model.impl 指向这个新文件。
  零件写了 loss，训练循环就用它 —— 成绩单「训练诊断」里的「损失来源」会写明。
    batch 是这一批的表：date 是整数（如 20220415），label 是标签。
    d = 这条样本离训练期最后一天差几天（把 date 转成日期再相减）。
    最后一天可以写进配置，也可以直接取这一批里最大的 date —— 一批 8192 行
    几乎必然包含最后一天；就算不含，权重也只是整体差一个倍数，谁重谁轻不变。
    权重 w = decay ** d（decay 从配置读，典型 0.9~0.99），
    逐条 BCE（reduction="none"）乘上 w 再取平均。
  ⚠️ 只用训练集自己的日期算，不许看验证集的日期范围（R2）。
  ⚠️ 别拿"距训练期末尾的天数"当特征来绕 —— 验证集全在训练期之后，
     这一列在验证集上是个常数，模型学不到任何能迁移的东西。

失败信号: |
  · 分数不动 —— 先看「损失来源」写的是不是你的零件；是，多半是 decay 太接近 1
    （等于没衰减），先试 0.9 看有没有反应
  · 分数明显下降 —— decay 太小，等于把大半训练数据扔了，样本量不够了
  · 训练集分数涨、验证集反而跌 —— 权重让模型过拟合到了训练期末尾那几天

出处: |
  时间衰减样本加权是工业推荐系统的常规做法，用于对抗概念漂移
