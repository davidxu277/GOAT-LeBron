编号: ESMM
名字: 全曝光空间建模转化率

治哪些毛病: [转化样本偏差]
属于哪个环节: 模型 + 损失函数

为什么管用: |
  买东西的人一定先点过。所以"点了会不会买"只能在点过的人身上观察到，
  可训练出的模型却要对所有曝光做预测 —— 学习样本与使用场景不一致，必然学偏。
  而且转化样本极少，数据太稀。
  这招不直接学"点了会不会买"，改为学"会不会点"和"看了之后会不会买"两件事，
  两者相除得到答案。这样全部曝光都参与训练，学偏和数据稀疏一起解决。

# ⚠️ 下面这两个数是最初拍的，方向存疑：如果官方 baseline 就是 NISE，
#    ESMM 是它的手下败将，delta 可能是负的。见 docs/baseline笔记.md Q2。
预计能提多少: {购买AUC: 0.01, 点击AUC: 0.0}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.2}
前提条件: []
靠不靠谱: 0.85

怎么实现: |
  两个塔共享同一份 embedding 表：
    塔A 输出 P(点击)，塔B 输出 P(购买 | 曝光)
    损失 = BCE(塔A, click) + BCE(塔A × 塔B, click × conversion)
  注意：报分口径见 CLAUDE.md 第五节 —— 两种范围都要算、都要记。

出处: |
  阿里 2018 年提出，正是在本数据集上首次发表
