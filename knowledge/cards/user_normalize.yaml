编号: 用户内归一化
名字: 分数只在用户自己内部比

治哪些毛病: [退化用户占比高, Top5排不上去]
属于哪个环节: 模型 + 收尾

为什么管用: |
  评测是**用户内**排序：每个用户只跟自己的曝光比，跨用户的分数高低毫无意义。
  但模型输出的是一个全局分数 —— 活跃用户整体分数偏高、冷淡用户整体偏低，
  这种用户间的偏移对指标没有任何贡献，却挤占了模型的表达能力。
  预测完之后按用户把分数减去该用户的均值（或转成用户内排名），
  排序结果不变但数值分布干净了，后续融合与阈值判断都更稳。

预计能提多少: {GAUC: 0.002, nDCG@5: 0.003}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.0}
前提条件:
  - 预测结果里带 user_id
靠不靠谱: 0.5

怎么实现: |
  预测之后、评测之前，按 user_id 分组：
      score' = score - mean(score of this user)
  或者更强的做法：score' = 该用户内的百分位排名。
  ⚠️ 单模型时这一步**不会改变**用户内次序，因此指标不变 ——
  它的价值在多模型融合、以及让"退化用户占比高"这个病看得更清楚。
  想直接提分，得配合训练时也用用户内的目标（见「pairwise_loss」）。
  配置：train.user_normalize.enabled / train.user_normalize.mode

失败信号: |
  · 分数一点没变 —— 正常，单模型下它本来就不改次序，别当成"这招没用"
  · 融合之后反而变差 —— 归一化方式（减均值 vs 排名）跟融合权重不匹配

出处: |
  GAUC / 用户内排序场景的常规后处理
