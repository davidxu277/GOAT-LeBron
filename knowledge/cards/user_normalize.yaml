编号: 用户内归一化
名字: 融合前先把分数拉到用户内的同一把尺子上

# 以前还治「退化用户占比高」—— 治不了。那些用户要么零正例、要么全正例，
# GAUC 本来就不统计、nDCG 本来就记 0，分数怎么变换都一样。
治哪些毛病: [Top5排不上去]
属于哪个环节: 收尾

为什么管用: |
  评测是**用户内**排序：每个用户只跟自己的曝光比，跨用户的分数高低毫无意义。
  预测完之后按用户把分数转成用户内排名，用户内的次序不变，
  但不同模型的分数被拉到了同一把尺子上 —— 这对**多模型融合**有用：
  不归一化直接平均，分数尺度大的那个模型会在融合里说了算，
  融合后的前 5 名其实是它一个人排的。

  ⭐ 必须诚实：**单模型时这一步是恒等变换**。减去一个用户内的常数、或换成用户内排名，
  都不改变任何用户内的先后次序，GAUC 和 nDCG@5 一个小数位都不会动。
  所以这张卡的预计提升是 0，只在融合那一步才轮得到它。

预计能提多少: {GAUC: 0.0, nDCG@5: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 只在多模型融合时才有意义 —— 单模型下它是恒等变换，跑了也是「未生效」
  - 流水线要有"预测之后、评测之前"的挂载点 —— 目前没有
靠不靠谱: 0.5

怎么实现: |
  融合时，对每个参与融合的模型，先按 user_id 分组：
      score' = 该用户内的百分位排名
  再把各模型的 score' 按验证集主分加权平均。

失败信号: |
  · 分数一点没变 —— 单模型下它本来就不改次序，这是预期，不是"这招没用"。
  · 融合之后反而变差 —— 融合权重不对，按验证集主分重新配权。

出处: |
  GAUC / 用户内排序场景的常规后处理
