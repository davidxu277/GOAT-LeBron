# 来源：语料包 06_论文综述 §1.7（优先级 S，建议蒸馏为 MC-17）
# 方向不受 Q2 影响：骨干网络改动。
# 定位：DCNv2 的低风险升级 —— 只换 cross 层，其余不动，完美符合"一轮只改一件事"。

编号: GDCN
名字: 带门控的深度交叉网络

治哪些毛病: [特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  DCNv2 有个已知毛病：cross 层一深就变差。原因是它对所有交叉项一视同仁 ——
  第 4 层会生成海量四阶组合，其中绝大多数是没意义的噪声交叉，
  有用的信号被淹没在里面。所以实践中 cross 层只能叠 2~4 层，深了反而掉分。

  GDCN 在每层 cross 后面加一道门：用 sigmoid 算出每一维交叉项该放行多少，
  没用的交叉直接被压到接近 0。噪声被滤掉之后，8 层以上的深交叉仍然有效，
  论文报告的增益随层数单调上升 —— 正好和 DCNv2 "深了掉分"形成对照。

  附带好处：门控值本身可以可视化，能看出模型在用哪些交叉，
  这对我们写报告解释"Agent 为什么选这一招"很有用。

预计能提多少: {点击AUC: 0.004, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.35}
前提条件:
  - 建议先试过 DCNv2，确认交叉这条轴有收益再上（否则不知道门控贡献了多少）
靠不靠谱: 0.6

怎么实现: |
  在 DCNv2 的 cross 层上加一个并行的门控分支：
    信息分支 = W_c · x_l + b_c          （和 DCNv2 的 cross 一样）
    门控分支 = sigmoid(W_g · x_l + b_g)  （新增，同样形状）
    x_{l+1} = x₀ ⊙ (信息分支 ⊙ 门控分支) + x_l

  也就是在原来 cross 的乘法项上再逐元素乘一个 0~1 的门。
  参数量大约翻倍（多一套 W_g），但层数可以叠更深。

  层数从 4 起步（比 DCNv2 深，这正是它的卖点），配置里可调到 8。
  层数、门控是否共享参数从配置读（R7）。

失败信号: |
  · 加深到 6~8 层仍然没有比 DCNv2 的 3 层更好 —— 说明这个数据集的有效交叉阶数本来就低，
    交叉轴见顶，换轴（别再试 DCNv3 之类的更激进变体）。
  · 训练时间超过预算的 5% —— 深 cross 塔的代价，减层数或换回 DCNv2。
  · 门控值全部饱和到 0 或 1 —— 门控没起作用，检查门控分支的初始化。

出处: |
  Wang et al., "Towards Deeper, Lighter and Interpretable Cross Network for
  CTR Prediction", CIKM 2023, arXiv:2311.04635
