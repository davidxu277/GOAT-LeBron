# 来源：语料包 method_cards.md MC-06
# 方向不受 Q2 影响：骨干网络改动。
# DCNv2 是官方 baseline 支持的三种骨干之一（mlp / deepfm / dcn），可直接对照官方数字。

编号: DCNv2
名字: 显式高阶特征交叉网络

治哪些毛病: [特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  DeepFM 的 FM 头只做二阶交叉（两个字段相乘）。但真实决策里三阶、四阶的组合
  也有信息："这个消费水平的用户 × 这个价位的类目 × 这个展示位置"。
  想靠 FM 拿到高阶交叉，只能人工再造字段。

  DCN 的 cross 层每叠一层，交叉阶数就升一阶，而且是显式算出来的 ——
  每一层都把"原始输入"和"上一层输出"做一次逐元素相乘再加回去。
  v2 相对初代的改进是把里面的向量参数换成矩阵，表达能力更强，
  同时提供低秩分解版本（DCN-Mix）来控制参数量。

预计能提多少: {点击AUC: 0.003, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.25}
前提条件: []
靠不靠谱: 0.6

怎么实现: |
  cross 层的递推式（x₀ 是 embedding 拼接后的原始输入，x_l 是第 l 层输出）：
    x_{l+1} = x₀ ⊙ (W_l · x_l + b_l) + x_l
  其中 ⊙ 是逐元素乘，W_l 是可学习矩阵，最后那个 + x_l 是残差。

  整体结构两种接法，都要试一下（从并联开始）：
    并联 —— cross 塔和 MLP 塔各跑各的，输出拼接后进最终层
    串联 —— 先过 cross 塔，输出再喂给 MLP 塔

  层数从 2 起步，最多试到 4。层数、是否低秩、低秩维度全部从配置读（R7）。

  官方 baseline 有现成实现：torch_rechub/models/multi_task/ 下的 DCN4MMOE。

失败信号: |
  · 层数加深反而变差 —— 这是 DCN-v2 已知行为（论文自己报告过），
    不是 bug，别继续加层；到此为止或换「GDCN」那张卡（它专门解决这个）。
  · 参数量爆炸、显存不够 —— 换低秩版本 DCN-Mix，秩从 embedding 维度的 1/4 起试。
  · 和 DeepFM 收益重叠、二者都只有噪声级提升 —— 交叉这条轴已经见顶，换轴。

出处: |
  Wang et al., "DCN V2: Improved Deep & Cross Network and Practical Lessons
  for Web-scale Learning to Rank Systems", WWW 2021（Google，
  论文明确报告部署于 Google 网页级排序系统）
