# 来源：语料包 06_论文综述 §3.1（优先级 S，建议蒸馏为 MC-19）
# ⚠️ 与 Q2 部分相关：NISE 自己带一套自适应任务权重（w = min(loss_ctr/loss_cvr, β)）。
#    若官方 baseline 就是 NISE，这张卡是"换一种权重策略"而不是"从无到有"，
#    收益会小很多。但它与 NISE 的机制不同（这里是可学习参数，NISE 是损失比例），
#    仍可作为独立假设，故不清零、只调低预期。

编号: 不确定性加权
名字: 让两个任务的损失权重自己学

治哪些毛病: [两个任务打架]
属于哪个环节: 损失函数

为什么管用: |
  多任务训练要把两个损失加起来，权重怎么定？绝大多数实现直接 1:1，
  但这几乎肯定不是最优 —— 点击损失和购买损失的量级差很多
  （转化正样本是千分位，购买损失天然更小更噪），1:1 等于让点击任务主导梯度。

  手工调这个权重要花很多轮实验。这招把权重变成可学习参数：
  给每个任务配一个标量 σ，损失写成 Σ 1/(2σᵢ²)·Lᵢ + log σᵢ。
  σ 越大代表这个任务的观测噪声越大，前面的系数就自动把它的权重压下去；
  后面的 log σ 项防止模型偷懒把所有权重都学成 0。

  最大的优点是便宜：多两个标量参数，改动两行，任何多任务骨干都能套。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.002}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 若官方 baseline 是 NISE，它已自带自适应权重，本卡收益会显著缩水（Q2）
靠不靠谱: 0.55

怎么实现: |
  为数值稳定，学 s = log σ² 而不是直接学 σ：
    self.log_var_ctr = nn.Parameter(torch.zeros(1))
    self.log_var_cvr = nn.Parameter(torch.zeros(1))

    loss = (torch.exp(-self.log_var_ctr) * loss_ctr + self.log_var_ctr
          + torch.exp(-self.log_var_cvr) * loss_cvr + self.log_var_cvr)

  这两个参数要加进优化器（和模型参数一起），且通常不加 weight_decay。
  初始值从配置读（默认 0，即初始权重 1:1）。

  ⭐ 每轮把学到的 exp(-log_var) 两个值记进日志 —— 它们本身就是很好的诊断信号，
  能看出模型认为哪个任务更可信。

失败信号: |
  · 某个任务的权重被压到接近 0 —— 该任务实际上被放弃了，
    检查是不是它的损失量级异常（比如没做归一化），必要时给权重加下界。
  · 两个 AUC 都没动 —— 说明 1:1 本来就接近最优，这条轴到此为止。
  · loss 出现 NaN —— log_var 跑飞了，给它加数值范围裁剪。

出处: |
  Kendall, Gal & Cipolla, "Multi-Task Learning Using Uncertainty to Weigh
  Losses for Scene Geometry and Semantics", CVPR 2018, arXiv:1705.07115
