# 来源：语料综述 §十一「蒸馏节奏」建议合并成 MC-21 的三项：Focal Loss / PCGrad / MetaBalance。
# SWA 已经单独成卡（见 swa.yaml），本卡不重复收录，避免两张卡内容打架。
#
# ⚠️ 复合卡使用纪律（针对"打包测试无法归因"的问题）：
# 三项技巧解决的其实是两类不同的病（Focal 治稀疏、PCGrad/MetaBalance 治任务冲突），
# 硬凑成一张卡本身就有归因风险。为了不让这张卡变成"图省事打包"，加两条硬约束：
#
#   1. 只有同一轮里【同时】诊断出"转化样本偏差"（或数据极稀疏的信号）和
#      "两个任务打架"两种病，才允许提这整张复合卡；只诊断出一种病，
#      应该只用对症的那一部分（Focal 单独用，或 PCGrad/MetaBalance 二选一单独用），
#      不要为了"顺手多试几个"而打包。
#   2. 这张卡一旦被采纳且效果超过噪声带，下一轮必须先做拆解验证
#      （逐个关掉三项里的一项，看分数分别掉多少），把归因补回来，
#      之后才能继续换轴。拆解验证的轮次不算浪费——归因不清的"提升"
#      在军师后续引用它作为证据时，可信度和一条编造的证据没有区别。

编号: 训练技巧复合卡
名字: 稀疏样本损失整形 + 任务梯度冲突处理

治哪些毛病: [转化样本偏差, 两个任务打架]
属于哪个环节: 损失函数 + 训练策略

为什么管用: |
  这张卡其实是两个不同病根的两组药凑在一起，讲清楚免得被当成一个机制：

  Focal Loss 治的是"转化样本偏差"里数据太稀那一半：转化正样本千分位，
  海量易分负样本把梯度全占了，购买塔学不动。给交叉熵乘一个 (1−pₜ)^γ，
  把损失预算从"已经分对的简单样本"挪给难样本，逼模型多关注稀少的正样本。

  PCGrad 和 MetaBalance 治的是"两个任务打架"：点击和购买两个任务共享底座时，
  梯度方向可能互相冲突（一个任务想往左调参数，另一个想往右调）。
  PCGrad 直接检测两个任务梯度的夹角，冲突就把一方投影消去冲突分量；
  MetaBalance 换个思路，不动梯度方向，只把两个任务梯度的量级拉到可比范围
  （防止购买任务的稀疏梯度被点击任务的密集梯度淹没）。

  三者机制互不重叠，理论上可以叠加；但"能叠加"不等于"叠加效果等于各自
  单独测出来的效果之和"——机制之间可能有交互，具体见下面的预期给法。

预计能提多少: {点击AUC: 0.001, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.3}
前提条件:
  - 军师只有在同一轮同时诊断出"转化样本偏差"（含稀疏信号）和
    "两个任务打架"两种病时，才可以提这整张复合卡
  - 只诊断出其中一种病 → 改提对应的单项技巧，不要打包
  - 已有共享底座的多任务结构（PCGrad/MetaBalance 需要拿到逐任务梯度）
靠不靠谱: 0.5

怎么实现: |
  三项分开实现，方便下一轮拆解验证时能逐个关掉：

  ① Focal Loss（作用于购买塔的损失）
     loss_cvr = -alpha * (1-p)^gamma * y*log(p) - (1-alpha)*p^gamma*(1-y)*log(1-p)
     gamma 从配置读，建议从 2.0 起步；gamma=0 时退化为普通交叉熵。
     只对购买塔的损失做这个替换，点击塔保持原样。

  ② PCGrad（每步反传前处理）
     对每一对任务 (i, j)：算梯度 gᵢ、gⱼ 的余弦相似度；
     若为负（冲突），把 gᵢ 投影到 gⱼ 的法平面上：gᵢ' = gᵢ − (gᵢ·gⱼ/‖gⱼ‖²)·gⱼ。
     需要能分别拿到每个任务对共享参数的梯度（分别 backward 两次，
     累加前先各自暂存），显存和时间开销约翻倍——这是它比 MetaBalance 贵的原因。

  ③ MetaBalance（每步反传前处理，和 PCGrad 二选一，不要同时开）
     以点击任务梯度范数为基准，把购买任务梯度的范数缩放到可比量级：
     g_cvr_scaled = g_cvr * (‖g_ctr‖ / ‖g_cvr‖) * r
     r 是松弛系数（0~1），从配置读，建议从 0.7 起步。

  gamma、alpha、r 全部从配置读（R7）。self_check 里要写清楚这一轮
  实际打开了哪几项（比如"本轮只开 Focal + MetaBalance，PCGrad 关闭"），
  为下一轮的拆解验证留档。

失败信号: |
  · 三项一起上，分数涨了但复盘官判"说不清"或涨幅不到噪声带 ——
    这正是打包风险兑现的样子，按前提条件里的规矩，下一轮必须拆解验证。
  · PCGrad 训练时间涨了不止 30% —— 每任务反传两次的开销比预期大，
    改用 MetaBalance（更便宜）而不是继续用 PCGrad。
  · Focal Loss 打开后购买塔预测概率普遍失真（比如全部挤在低值）——
    gamma 调太大，回调到 1.0 附近。
  · PCGrad 和 MetaBalance 同时打开 —— self_check 该拦住这个组合，
    两者解决同一个问题、机制不同，同时开无法归因谁起了作用。

出处: |
  Focal Loss: Lin et al., ICCV 2017, arXiv:1708.02002（FAIR）。
  PCGrad: Yu et al., "Gradient Surgery for Multi-Task Learning",
  NeurIPS 2020, arXiv:2001.06782（Stanford）。
  MetaBalance: He et al., WWW 2022, arXiv:2203.06801（Meta）。
