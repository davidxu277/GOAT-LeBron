# 来源：语料包 06_论文综述 §1.6（优先级 S，建议蒸馏为 MC-16）
# 方向不受 Q2 影响：骨干网络改动。
# 定位：探索轮性价比最高的骨干 —— 训练成本约等于裸 MLP，超参不敏感，失败模式少。

编号: FinalMLP
名字: 双流 MLP + 双线性融合头

治哪些毛病: [特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  DeepFM、DCN 这一系都建立在一个信念上：必须显式地把特征交叉算出来。
  FinalMLP 反过来质疑这件事 —— 它整个模型里没有任何专门的交叉网络，
  却在多个公开榜单上长期压过那些显式交叉模型。

  它的做法是两条并行的 MLP，各自配一道特征门控，让两条流看到的特征视图不一样
  （一条可能更关注用户侧，另一条更关注商品侧，由模型自己学）。
  最后不是简单拼接，而是用一个双线性融合头把两条流的输出做二阶交互 ——
  交叉只发生在最后这一步，但因为两条流已经各自学出了高层语义，
  在这个层面做交叉比在原始 embedding 上做更有效。

  对我们的实际价值：训练成本几乎等于裸 MLP，超参不敏感，
  在"跑得快、失败少"这两点上特别适合让 Agent 自主迭代。

预计能提多少: {点击AUC: 0.004, 购买AUC: 0.003}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.1}
前提条件: []
靠不靠谱: 0.65

怎么实现: |
  三个部件：
    1. 特征门控（两份，各自独立）
       用一小段 MLP 从"上下文特征"算出一个和 embedding 等长的门控向量，
       逐元素乘到拼接后的 embedding 上，得到这条流专属的输入视图。
       两条流的门控参数不共享 —— 这是它们看到不同视图的原因。
    2. 两条并行 MLP
       结构可以不对称（比如一条 [400,400,400]、一条 [800]），从配置读。
    3. 双线性融合头
       输出 = b + w₁ᵀo₁ + w₂ᵀo₂ + o₁ᵀ W o₂
       其中 o₁/o₂ 是两条流的输出。W 可以分组（把向量切成 k 组，组内做双线性）
       来控制参数量，k 从配置读。

失败信号: |
  · 两条流学得几乎一样（输出高度相关）—— 门控没起作用，
    检查两套门控参数是不是被误共享了。
  · 融合头参数量爆炸 —— W 是 d×d 的，把分组数 k 调大。
  · 和其他骨干都只有噪声级差异 —— 骨干这条轴见顶，去动特征或损失函数。

出处: |
  Mao et al., "FinalMLP: An Enhanced Two-Stream MLP Model for CTR Prediction",
  AAAI 2023, arXiv:2304.00902（华为诺亚；BARS/FuxiCTR 榜单长期最强基线之一）
