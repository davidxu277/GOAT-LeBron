# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」

编号: DR
名字: 双重稳健（ESCM²-DR）

治哪些毛病: [转化样本偏差, 结果不稳]
属于哪个环节: 损失函数

为什么管用: |
  IPS 那招有个毛病：分母（预测点击概率）一旦估得不准，权重就会大得离谱，
  分数忽高忽低。这招加了第二道保险 —— 另外训一个小模型，
  专门预测"这条样本如果被点了，损失大概是多少"，
  然后用它去补上没被点的那些样本。
  两道保险只要有一道是准的，结果就是对的，所以叫"双重稳健"。
  代价是多了一个要训的小模型。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 难, 训练时间倍数: 1.8}
前提条件:
  - 需先确认官方 baseline 不是 NISE（见 docs/baseline笔记.md 第零节 Q2）
  - 建议先试 IPS —— DR 是 IPS 的加固版，IPS 没效果时 DR 大概率也没有
靠不靠谱: 0.5

怎么实现: |
  参考实现：NISE repo
  torch-rechub/torch_rechub/models/multi_task/dr.py + mtl_trainer.py 的 DR 分支
  注意：baseline 里补偿模型用的是**独立的优化器**，每个 batch 先更新它、
  再更新主模型（mtl_trainer.py:231 起）。这一步容易写漏。
  补充：
    双重稳健 = 倾向加权 + 一个补偿模型，两者只要有一个是对的，估计就无偏（双保险）。
    补偿模型学的是"如果这个样本被点了，购买标签的残差大概是多少"。
    ⭐ 两个优化器的更新顺序不能反：每个 batch 先用当前主模型的输出更新补偿模型，
    再用更新后的补偿模型算主模型的损失。写成同一个优化器就退化成普通多任务了。
    补偿模型的结构和主塔一致即可（baseline 用 imputation_params，dims=[160,80]）。

失败信号: |
  · 补偿模型的损失一直不动 —— 十有八九是两个优化器写成了一个，先查这个。
  · 训练比 IPS 更不稳 —— DR 的双模型会互相追逐，降低补偿模型的学习率。
  · 比 IPS 没有更好 —— 说明倾向分本身就够准，用更简单的 IPS，别为复杂度买单。

出处: |
  阿里 2022《ESCM²》(SIGIR)。实现参考了 AutoDebias 仓库。
  NISE 论文的对照组之一
