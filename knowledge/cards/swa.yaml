# 来源：语料包 06_论文综述 §5.2（优先级 A，建议并入训练技巧复合卡 MC-21）
# 方向不受 Q2 影响：训练过程改动，可以叠加在任何深度模型上。

编号: SWA权重平均
名字: 把训练尾段的多个权重快照平均起来

治哪些毛病: [在背题, 结果不稳]
属于哪个环节: 训练策略

为什么管用: |
  训练到后期，参数并不会稳稳停在某个点上，而是在损失曲面的一个"盆地"边缘
  来回打转 —— 每一轮的权重都落在盆地壁上的不同位置，各自都有点偏。

  把这些位置平均一下，就落到了盆地的中心。中心的特点是周围比较平坦，
  也就是参数稍微变一点、损失也不会大变 —— 这种解通常泛化更好。

  两个额外好处：它是"单次训练内部的集成"，和「多种子平均」那张卡
  （多次训练之间的集成）互补，两者可以叠加；而且推断时没有任何额外开销，
  最终还是一个模型、一份权重。

  实现只有十来行，是性价比很高的一张卡。对树模型不适用。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.002}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.05}
前提条件:
  - 只对深度模型有效（LightGBM 那条路用不了）
  - 需要训练能跑到后期（如果早停总在第 2 轮触发，没有尾段可平均）
靠不靠谱: 0.55

怎么实现: |
  在训练尾段维护一份权重的滑动平均：
    从第 start_epoch 轮开始（建议总轮数的 75%），每轮结束后：
      swa_weights = (swa_weights * n + current_weights) / (n + 1)
      n += 1
  训练结束后用 swa_weights 替换模型权重。

  ⭐ 关键一步（最容易漏）：如果模型里有 BatchNorm，替换权重后必须用训练数据
  重新跑一遍前向来更新 BN 的滑动统计量，否则分数会崩。
  纯 MLP + embedding 的结构如果没有 BN 就不用管这步。

  配合周期性学习率效果更好（尾段让学习率在一个小范围内周期波动，
  使快照落在盆地的不同位置），但先用固定学习率跑通再说。

  start_epoch、是否配周期学习率全部从配置读（R7）。

失败信号: |
  · 平均后分数明显变差 —— 十有八九是 BN 统计量没更新，先查这个。
  · 完全没变化 —— 尾段的权重快照几乎相同（学习率太小），
    要么提前 start_epoch，要么配周期性学习率。
  · 和多种子平均叠加后没有额外收益 —— 两者收益重叠，保留便宜的那个即可。

出处: |
  Izmailov et al., "Averaging Weights Leads to Wider Optima and Better
  Generalization", UAI 2018, arXiv:1803.05407
