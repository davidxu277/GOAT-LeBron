# 来源：语料包 06_论文综述 §5.2（优先级 A）
# 训练过程改动，可以叠加在任何深度模型上。

编号: SWA权重平均
名字: 把训练尾段的多个权重快照平均起来

治哪些毛病: [在背题, 结果不稳]
属于哪个环节: 训练策略

为什么管用: |
  训练到后期，参数并不会稳稳停在某个点上，而是在损失曲面的一个"盆地"边缘
  来回打转 —— 每一轮的权重都落在盆地壁上的不同位置，各自都有点偏。

  把这些位置平均一下，就落到了盆地的中心。中心的特点是周围比较平坦，
  也就是参数稍微变一点、损失也不会大变 —— 这种解通常泛化更好。

  两个额外好处：它是"单次训练内部的集成"，和「多种子平均」那张卡
  （多次训练之间的集成）互补，两者可以叠加；而且推断时没有任何额外开销，
  最终还是一个模型、一份权重。

  实现只有十来行，是性价比很高的一张卡。对树模型不适用。

预计能提多少: {GAUC: 0.002, nDCG@5: 0.002}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.05}
前提条件:
  - 只对深度模型有效（LightGBM 那条路用不了）
  - 训练要能跑到尾段 —— 出厂配置开着早停，如果早停在 SWA 开始平均之前就触发了，一个快照都没攒下，这一步等于没做（成绩单「改动是否生效」会判未生效）
靠不靠谱: 0.55

怎么实现: |
  零件是现成的，只发 config_patch，不交文件：
  ```yaml
  train:
    swa:
      enabled: true
      impl: modules/train/swa.py
      start_epoch_ratio: 0.75
  ```
  从「总轮数 × start_epoch_ratio」那一轮开始，每轮结束后把权重累加进滑动平均，
  训练结束时用平均权重替换模型权重 —— 这一步在"回滚到最好一轮"之后执行，
  所以最终用的是平均权重。
  当前模型是纯 MLP + embedding，没有 BatchNorm，不用重算 BN 统计量；
  哪天换成带 BN 的模型，这一步必须补上，否则分数会崩。

失败信号: |
  · 平均后分数明显变差 —— 十有八九是 BN 统计量没更新，先查这个。
  · 完全没变化 —— 看「改动是否生效」：未生效说明早停抢在 SWA 之前停了，
    把 start_epoch_ratio 调小；生效了还没变化，说明尾段快照几乎相同（学习率太小）。
  · 和多种子平均叠加后没有额外收益 —— 两者收益重叠，保留便宜的那个即可。

出处: |
  Izmailov et al., "Averaging Weights Leads to Wider Optima and Better
  Generalization", UAI 2018, arXiv:1803.05407
