编号: popularity_prior
名字: 调整商品热度平滑
治哪些毛病: [冷门视频排不上去, Top5排不上去]
属于哪个环节: 模型配置
为什么管用: 热度统计对稀疏视频容易过拟合，调整先验强度可在视频自身统计与全局均值之间平衡。
预计能提多少: {点击AUC: 0.003, 购买AUC: 0.003}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.0}
前提条件: [只用Train计算热度]
靠不靠谱: 0.6
怎么实现: 修改model.prior，候选范围5到100；不要接触Validation标签计算统计量。
失败信号: GAUC与nDCG@5均未提升。
出处: KuaiRand官方popularity baseline
