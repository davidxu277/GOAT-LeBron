编号: popularity_prior
名字: 视频热度先验

治哪些毛病: [冷门视频排不上去, Top5排不上去]
属于哪个环节: 特征

为什么管用: |
  一条视频在训练期被曝光了多少次，本身就是信息：平台愿意反复推的视频，
  放进任何一个用户的候选里都更可能被看完。但模型现在只有 video_id 那一份 embedding ——
  训练集 7538 个视频里约 14% 曝光不到 10 次，这些视频自己的 embedding 学不出东西，
  而"它是个冷门视频"这件事模型也不知道。

  把训练期曝光次数分几档，作为一个新的类别特征接进去：冷门视频至少能共享
  "冷门档"那一份学得出来的 embedding，而不是各自一份没学好的随机向量。

预计能提多少: {GAUC: 0.003, nDCG@5: 0.003}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.0}
前提条件:
  - 曝光次数只用训练集算（R2）
  - 别去读 video_features_statistic 那张表 —— 它的统计没有按日期切开，很可能覆盖了验证期，确认之前一律当泄漏处理
靠不靠谱: 0.6

怎么实现: |
  零件是现成的，只发 config_patch，不交文件：
  ```yaml
  features:
    视频热度分桶:
      enabled: true
      impl: modules/features/video_freq.py
      field: video_id
      edges: [10, 100, 1000]
  ```
  分桶边界从配置读；新列「视频热度桶」会自动进特征表。
  想更进一步：同样的思路用在 author_id 上（作者热度），
  或者把次数换成平滑看完率 —— 那就是「目标编码」卡了。

失败信号: |
  · GAUC 与 nDCG@5 都没动 —— video_id 的 embedding 可能已经学到了热度；
    看「按视频曝光次数分组」最低那一桶有没有变化，没有就换轴。
  · 高频桶涨、低频桶掉 —— 冷门视频全挤在一档里，把低端的边界切细。

出处: KuaiRand 官方 popularity baseline
