# 来源：语料包 method_cards.md MC-07
# 方向不受 Q2 影响：骨干网络改动。
# ⚠️ 这张卡有硬门槛：提不出具体该交叉哪两个字段、为什么，就不要提这个方案。
#    优先考虑 DeepFM / DCNv2 / GDCN —— 它们不需要人工指定交叉。

编号: WideAndDeep
名字: 人工交叉记忆 + 深度泛化

治哪些毛病: [特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  embedding 天生会"抹平"：两个 ID 只要行为相似，向量就会靠近。
  这对泛化是好事，但会丢掉一类信息 —— 某些具体组合本身就是强信号，
  比如"这个特定的用户画像分组 × 这个特定类目"历史上转化率极高，
  这种搭配的价值不来自任何可泛化的规律，就是记住了才有用。

  Wide&Deep 并联两部分：wide 部分是人工指定的交叉特征直接做线性回归，
  负责"死记硬背"这些具体组合；deep 部分就是现有的 MLP，负责泛化。
  两者相加。

  它的适用条件很窄：你得先知道该交叉哪两个字段。
  如果说不出来，用 DeepFM / DCNv2 让模型自己找。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.002}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.05}
前提条件:
  - 必须在方案里点名具体交叉哪两个字段、以及为什么认为这个组合有信息
  - 说不出具体组合 → 这张卡不适用，改用 DeepFM 或 DCNv2
靠不靠谱: 0.45

怎么实现: |
  wide 部分：
    把指定的字段对做笛卡尔积当成一个新的离散特征（比如 121×206），
    哈希到固定桶数以控制维度，然后接一个线性层（不过 embedding）。
  deep 部分：现有 MLP 塔不动。
  最终 logit = wide 线性输出 + deep 塔输出。

  候选交叉（按先验强弱排序，一次只加一组）：
    121 用户画像 × 206 商品类目
    125 年龄段  × 206 商品类目
    127 消费水平 × 216 品牌
  注意：数据里已经自带 4 个官方交叉字段（508/509/702/853），
  先确认「多值字段接回来」那张卡已经把它们用上了 —— 那个更便宜。

  哈希桶数从配置读（R7）。

失败信号: |
  · 提升不到噪声带 —— 说明这个人工组合没有额外信息，
    不要再换一组人工交叉重试第三次，换成自动交叉的卡。
  · wide 部分权重全部趋近 0 —— 模型自己判定这组交叉没用，同上。
  · 训练集大涨、验证集不动 —— 哈希桶太多导致 wide 部分在背题，减桶数。

出处: |
  Cheng et al., "Wide & Deep Learning for Recommender Systems",
  DLRS@RecSys 2016, arXiv:1606.07792（Google，Google Play 应用推荐线上部署）
