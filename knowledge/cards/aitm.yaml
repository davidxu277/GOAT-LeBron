# 来源：语料包 06_论文综述 §2.2（优先级 A，建议蒸馏为 MC-18）
# 与 Q2 的关系：AITM 不在 NISE 的对照组里（那是 ESMM/MMoE/ESCM²/DCMT），
# 属于另一条谱系（顺序依赖建模）。其中"单调性约束"这一项可以叠加在任何
# ESMM 系模型上，改动极小，是本卡里风险最低的部分 —— 可以单独拆出来试。

编号: AITM
名字: 漏斗顺序信息迁移 + 单调性约束

治哪些毛病: [两个任务打架, 转化样本偏差]
属于哪个环节: 模型 + 损失函数

为什么管用: |
  MMoE/PLE 处理的是"并列的任务"—— 它们假设点击和购买地位对等，只是要共享参数。
  但曝光→点击→购买是一条有方向的链条：购买一定发生在点击之后，
  判断"会不会买"的时候，"这个人会不会点"是已知的前置信息，不是并列信息。

  AITM 做两件事：
  第一，在两个塔之间加一条定向的信息通道 —— 用注意力机制把点击塔学到的表征
  自适应地传给购买塔（传多少由模型自己决定），而不是让两个塔各学各的。
  第二，加一个单调性约束损失，强制模型输出满足 p(购买) ≤ p(点击)。
  这是漏斗结构的物理事实：买过的人必然点过，所以购买概率不可能超过点击概率。
  违反这条的预测一定是错的，直接用损失惩罚掉。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.25}
前提条件:
  - 需要一个已经稳定的双塔结构（ESMM 系）作为底座
靠不靠谱: 0.55

怎么实现: |
  建议拆成两个独立假设，先试便宜的那个：

  假设 A · 只加单调性约束（几行代码，强烈建议先试这个）
    loss_mono = mean(relu(p_purchase − p_click))
    总损失 = 原损失 + λ × loss_mono
    λ 从配置读，建议从 0.1 起步。
    这一项和现有的 ESMM/NISE 损失完全兼容，不动网络结构。
    ⭐ 顺带记一个诊断指标：违反单调性的样本比例。它本身就是很好的成绩单字段。

  假设 B · 加 AIT 信息迁移模块（改结构，较贵）
    在购买塔的每一层，把点击塔对应层的输出 z_ctr 拿过来：
      用 [z_cvr, z_ctr] 算注意力权重 w，再取 z_new = w₁·z_cvr + w₂·z_ctr
    注意力用一个小 MLP 算，参数从配置读。

失败信号: |
  · 违反单调性的样本本来就极少（<1%）—— 约束没有发挥空间，λ 调大也没用，
    直接放弃假设 A，说明模型已经自然满足漏斗结构。
  · λ 调大后购买 AUC 下降 —— 约束过强，压制了模型的排序能力；
    AUC 只看排序，不看绝对值，别为了满足约束牺牲排序。
  · 假设 B 让训练时间翻倍但收益不到噪声带 —— 只保留假设 A。

出处: |
  Xi et al., "Modeling the Sequential Dependence among Audience Multi-step
  Conversions with Multi-task Learning", KDD 2021, arXiv:2105.08489
  （美团，信用卡业务四步链路线上部署）
