编号: 对齐自检
名字: 交之前先确认预测和数据对得上

治哪些毛病: [数据对不上]
属于哪个环节: 收尾

为什么管用: |
  这不是提分的招，是**防止交出一份看起来正常、其实错位的结果**。
  预测行数跟目标 split 差一行、user_id 顺序被打乱、分数里混进 NaN ——
  这些错误都不会让程序崩，只会让分数变成一个毫无意义的数字，
  而且往往到最终提交才暴露。
  官方评测按 user_id 分组算 GAUC，一旦对齐错了，算出来的是别人的分。

预计能提多少: {GAUC: 0.0, nDCG@5: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件: []
靠不靠谱: 0.9

怎么实现: |
  预测产出之后立刻断言，任何一条不满足就当场抛错，别往下走：
    1. len(预测) == len(目标 split)
    2. 预测里的 user_id 集合 == 目标里的 user_id 集合
    3. 分数全部有限（无 NaN / Inf）
    4. 分数不是常数（全一样等于没排序，GAUC 会退化成 0.5）
  ⚠️ 宁可当场崩，也不要产出格式对但内容错位的结果。

失败信号: |
  · 断言 4 触发 —— 模型没学到任何东西，先去查训练那一步，不是这里的问题
  · 断言 2 触发且只差几个用户 —— 多半是某个 split 里有零曝光用户被过滤了

出处: |
  对应 CLAUDE.md 的「危险信号」一节
