# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」

编号: DTP
名字: 动态任务优先级

治哪些毛病: [两个任务打架]
属于哪个环节: 训练策略

为什么管用: |
  两个任务权重固定时，先学会的那个会继续占用力气，落后的一直落后。
  这招按"当前谁学得差"来分配力气：每隔一阵子量一次两个任务各自的 AUC，
  谁的分低就给谁更大的权重，谁已经学得好就少花力气在它身上。
  相当于老师把时间优先给还没跟上的科目。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.05}
前提条件:
  - 需先观察到两个任务的分数一涨一跌，否则没有理由动权重
靠不靠谱: 0.5

怎么实现: |
  TODO 成员2 填。参考实现：NISE repo mtl_trainer.py:319
  权重 = -(1 - kappa) * log2(kappa)，kappa 是该任务的滑动平均 AUC。
  注意一个坑：单个 batch 里可能一个正样本都没有，算 AUC 会直接抛异常。
  baseline 的办法是**每 100 个 batch 才算一次**并更新权重。
  100 这个数和 alpha=0.5 都要进配置（R7）—— 论文没给 alpha，是实现者自己定的。

出处: |
  2018《Dynamic Task Prioritization for Multitask Learning》(ECCV)。
  NISE repo 里是作者自己实现的（README 有说明），不是官方代码
