# ⚠️ 方向受 Q2 影响：PLE 出现在 NISE 论文的对照实验里（Table 5，混合专家一栏），
#    NISE 报告自己赢了它。若官方 baseline 就是 NISE，照搬 PLE 的 delta 可能是负的。
#    按成员3 的约定：预计增益填 0、靠谱度 0.5，前提条件里写死闸门。

编号: PLE
名字: 渐进式分层专家抽取

治哪些毛病: [两个任务打架]
属于哪个环节: 模型

为什么管用: |
  MMoE 给每个任务配一道门，让它们从同一堆专家里各取所需。
  但所有专家仍然是共享的 —— 当两个任务想学的东西方向相反时，
  同一个专家会被两边来回拉扯，谁也学不好，这就是跷跷板。

  PLE 把专家明确分成两类：任务专属专家（只服务一个任务，另一个任务碰不到）
  和共享专家（两个任务都能用）。想共享的部分走共享专家，想独立的部分
  有自己的地盘，不用抢。多层堆叠时逐层做这个抽取，所以叫"渐进式"。

  代价是这是多任务这条阶梯上最复杂的一档 —— 只有确实观察到 MMoE 仍然跷跷板
  才值得上，否则是在为不存在的问题付复杂度。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 难, 训练时间倍数: 1.5}
前提条件:
  - ⚠️ 先确认官方 baseline 不是 NISE（见 docs/baseline笔记.md 第零节 Q2）
  - 必须已经试过 MMoE，且日志里仍然能看到跷跷板（一个 AUC 涨、另一个跌）
靠不靠谱: 0.5

怎么实现: |
  单层 PLE（CGC，Customized Gate Control）的结构：
    专家分三组：点击任务专属 E_ctr、购买任务专属 E_cvr、共享 E_shared
    点击任务的门只在 E_ctr ∪ E_shared 上做 softmax 加权
    购买任务的门只在 E_cvr ∪ E_shared 上做 softmax 加权
    各自加权求和后进各自的塔

  多层时，中间层再加一个"共享门"把三组的输出重新混合后传给下一层。
  起步就用单层 CGC，别一上来堆多层。

  ⭐ 公平比较纪律：专家总参数量要和被替换的 MMoE 大致持平，
  否则分不清提升来自结构还是来自参数变多。

  专家个数、每组专家维度、层数全部从配置读（R7）。
  官方 baseline 仓库里没有 PLE 实现，需要自己写（MMoE 实现可参考：
  torch_rechub/models/multi_task/mmoe.py）。

失败信号: |
  · 参数量对齐后提升不到噪声带 —— 退回 MMoE，别在混合证据上采纳更复杂的结构。
  · 购买 AUC 在验证集上过拟合（训练涨验证跌）—— 转化正样本本来就稀疏，
    专属专家又加了参数，缩小专家维度或加正则。
  · 跷跷板依旧 —— 说明冲突不在共享参数层面，去试梯度层面的方案
    （DTP / DWA / 不确定性加权），或 STEM 那种嵌入层解耦的思路。

出处: |
  Tang et al., "Progressive Layered Extraction (PLE): A Novel Multi-Task
  Learning Model for Personalized Recommendations", RecSys 2020 最佳论文
  （腾讯，腾讯视频推荐线上部署）；NISE 论文 Table 5 对照方法之一
