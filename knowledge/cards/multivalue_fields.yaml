# 来源：语料包 method_cards.md 的特征侧思路 + docs/baseline笔记.md 洞 1
# 这张卡的方向不受 Q2（官方 baseline 是不是 NISE）影响 —— 无论 baseline 是谁，
# 把它扔掉的字段接回来都是正向的。建议作为第一轮实验。

编号: 多值字段接回来
名字: 把 baseline 扔掉的 8 个字段接回模型

治哪些毛病: [历史行为没用上]
属于哪个环节: 特征

为什么管用: |
  官方 baseline 的代码里有一行把 8 个字段直接排除在模型输入之外
  （mlp_model.py:69，注释写的理由是"ESMM 原论文只用稀疏特征"）。
  被扔掉的正好是最有信息量的两组：
  4 个用户历史行为字段（109_14 类目 / 110_14 店铺 / 127_14 品牌 / 150_14 意图），
  以及 4 个用户×商品交叉字段（508 / 509 / 702 / 853）。

  也就是说，23 个特征字段里有 8 个从来没进过模型。用户"过去逛过哪些类目"
  和"这个用户和这个商品有没有交集"这两类信息全部缺席，模型只能靠 ID 硬记。
  这不是模型结构的问题，是输入就少了三分之一。

预计能提多少: {点击AUC: 0.004, 购买AUC: 0.004}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.15}
前提条件: []
靠不靠谱: 0.7

怎么实现: |
  两组字段的处理方式不一样，建议分两步做，一次只动一组（便于归因）：

  第一步 · 4 个交叉字段（508/509/702/853）
    它们是单值带权重的，直接当稀疏 ID 特征加进 sparse_cols 即可，
    对应的 D508/D509/D702/D853 权重列作为稠密特征并行接入。
    这一步最简单，先跑它。

  第二步 · 4 个多值行为字段（109_14/110_14/127_14/150_14）
    每个字段是"一串 ID + 对应权重"，不能只取最后一个值（会丢信息，见 CLAUDE.md 第六节）。
    起步方案：对每个字段做加权平均池化 —— 取该字段所有 ID 的 embedding，
    按权重加权求和再归一化，得到一个定长向量接进主网络。
    进阶方案见「DIN 注意力池化」卡。

  注意：权重列的统计量（如归一化用的均值/最大值）只能用训练集算（R2）。

失败信号: |
  · 加完之后 AUC 单步暴涨超过 0.02 —— 大概率某个字段泄漏了标签，先审计再庆祝。
  · 显存/内存爆掉 —— 多值字段的 embedding 表比单值大得多，
    先把低频 ID 合并到一个 OOV 桶再试。
  · 只有交叉字段那一步有效、池化那一步无效 —— 说明池化方式太粗，
    换 DIN 注意力池化，而不是放弃这组字段。

出处: |
  被丢弃的事实来自官方 baseline 源码 mlp_model.py:69（见 docs/baseline笔记.md 洞 1）；
  字段含义见 数据/aliccp_schema.json
