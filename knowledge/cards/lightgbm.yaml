# 来源：语料包 method_cards.md MC-03
# 方向不受 Q2 影响：完全不同的模型家族，和 CVR 去偏方法族没有可比性问题。
# 定位：换轴用的备选骨干 + 终局融合的成员。CPU 就能训，没 GPU 的时段也能推进。

编号: LightGBM
名字: 梯度提升树基线

治哪些毛病: [训练太慢, 特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  表格数据上，梯度提升树和深度模型长期互有胜负，而训练成本差一个量级。
  它靠的是逐层找"哪个特征在哪个阈值上切一刀能最好地分开正负样本"，
  天然能捕捉非线性和特征间的交互，不需要 embedding、不需要 GPU、
  对类别不平衡和异常值也更稳。

  在我们这里它有三个用处：
  一是当"换轴"的备选 —— 深度这条轴卡住时，换一个完全不同的模型家族，
  比在同一条轴上继续微调更可能突破；
  二是它训练快，适合在探索轮快速验证特征工程类的假设是否有效；
  三是终局融合时，树模型和神经网络的错误模式不同，平均起来通常比单个都好。

  短板要说清楚：它不能做多任务，点击和购买得训两个独立模型，
  所以 ESMM 那套全空间建模的好处在这里拿不到。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 0.4}
前提条件:
  - 高基数 ID 必须先做编码（见「目标编码」卡）或用原生 categorical，
    绝不能 one-hot（百万级 ID 会直接撑爆内存）
靠不靠谱: 0.5

怎么实现: |
  训两个独立的二分类模型：
    点击模型 —— 在全部曝光上训，标签是 click
    购买模型 —— 只在 click=1 的样本上训，标签是 conversion
  （注意这正是 ESMM 要解决的样本选择偏差问题，这里没法避免，是这条路的固有代价。）

  关键设置：
    高基数 ID 用 categorical_feature 原生处理，或用「目标编码」卡的编码值
    早停盯验证集 AUC，patience 从配置读
    主要旋钮按影响力排序：learning_rate + n_estimators → num_leaves
                          → min_data_in_leaf → feature_fraction
    一轮只调一个旋钮（R7 要求全部从配置读）

  购买模型的正样本极少（千级），num_leaves 要比点击模型小很多，否则必然在背题。

失败信号: |
  · 购买模型的验证 AUC 在 0.5 附近 —— 正样本太少撑不起树模型，
    这条路对购买任务不通，只留点击模型进融合。
  · 连续两轮调参提升不到噪声带 —— 树这条轴调完了，回深度模型或去做特征。
  · 内存爆掉 —— 一定是哪里 one-hot 了高基数 ID，检查编码方式。

出处: |
  Ke et al., "LightGBM: A Highly Efficient Gradient Boosting Decision Tree",
  NeurIPS 2017（微软）
