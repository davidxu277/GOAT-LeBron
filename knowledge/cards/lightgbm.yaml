# 来源：语料包 method_cards.md MC-03
# 定位：换轴用的备选骨干 + 终局融合的成员。CPU 就能训，没 GPU 的时段也能推进。

编号: LightGBM
名字: 梯度提升树基线

治哪些毛病: [训练太慢]
属于哪个环节: 模型

为什么管用: |
  表格数据上，梯度提升树和深度模型长期互有胜负，而训练成本差一个量级。
  它靠的是逐层找"哪个特征在哪个阈值上切一刀能最好地分开正负样本"，
  天然能捕捉非线性和特征间的交互，不需要 embedding、不需要 GPU。

  在 KuaiRand 上它还有一个额外的好处：LightGBM 自带 lambdarank 目标，
  按 user_id 分组直接优化用户内排序（nDCG），跟评测口径天然一致 ——
  这恰好是深度那条路现在做不到的（见「pairwise_loss」卡的前提）。

  短板要说清楚：ID 类字段（video_id 七千多个、author_id 六千多个）树模型吃不好，
  得先靠「目标编码」那类统计特征把 ID 变成数值。

预计能提多少: {GAUC: 0.002, nDCG@5: 0.002}
要花多少力气: {代码难度: 中等, 训练时间倍数: 0.4}
前提条件:
  - 流水线要能跑非神经网络模型 —— 目前不能：训练循环要求模型零件的 build() 返回 torch.nn.Module，返回别的当场 TypeError。这张卡要等流水线加一条树模型的路才落得了地
  - 高基数 ID 先编码（见「目标编码」卡）或用原生 categorical，绝不能 one-hot
靠不靠谱: 0.5

怎么实现: |
  挂载点就位之后：一个模型、一个标签（long_view），目标用 lambdarank，按 user_id 分组：
    训练数据按 user_id 排好序，group 参数给每个用户的曝光条数
    早停盯验证集，patience 从配置读
    主要旋钮按影响力排序：learning_rate + n_estimators → num_leaves
                          → min_data_in_leaf → feature_fraction
    一轮只调一个旋钮（R7 要求全部从配置读）
  环境里已经装了 lightgbm，不用另装。

失败信号: |
  · 验证分明显低于深度模型 —— ID 信息没喂进去，先检查目标编码有没有接上。
  · 连续两轮调参提升不到噪声带 —— 树这条轴调完了，回深度模型或去做特征。
  · 训练集分数远高于验证集 —— num_leaves 太大，先减半。

出处: |
  Ke et al., "LightGBM: A Highly Efficient Gradient Boosting Decision Tree",
  NeurIPS 2017（微软）；Burges, "From RankNet to LambdaRank to LambdaMART:
  An Overview", Microsoft Research Technical Report, 2010
