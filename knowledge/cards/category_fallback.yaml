编号: 类目兜底
名字: 用类目信息给冷门商品兜底

治哪些毛病: [冷门视频排不上去, 新用户不会做]
属于哪个环节: 特征

为什么管用: |
  冷门商品在训练数据里出现次数太少，它自己那份 embedding 根本学不出信息。
  但同一个类目下的商品，用户行为是相似的。
  所以当一个商品出现次数很少时，让它借用所属类目的 embedding 来顶一顶，
  相当于借用同类兄弟的经验。出现次数越少，借得越多。

预计能提多少: {购买AUC: 0.003, 点击AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件: [数据里有类目字段 206]
靠不靠谱: 0.6

怎么实现: |
  在 embedding 层后面加一步混合：
    借用比例 = 1 − min(1, 该商品训练集出现次数 / K)
    最终 embedding = (1−借用比例) × 商品自己的 + 借用比例 × 类目的
  K 建议从 20 开始试。
  注意：出现次数只能用训练集统计，不能碰验证集（CLAUDE.md R2）。

失败信号: |
  · 低频桶的 AUC 涨了但高频桶掉了 —— K 取太大，热门商品自己的表示被类目稀释了，
    把 K 调小。
  · 所有桶都没动 —— 可能低频商品本来占比就小，或者 embedding 早就学到了类目信息；
    先看分桶的样本占比再决定要不要继续这条轴。
  · 冷启动那一档反而更差 —— 检查借用比例的方向有没有写反
    （出现次数越少应该借得越多）。

出处: |
  冷启动场景下的表示共享，推荐系统常见做法
