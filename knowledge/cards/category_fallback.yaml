编号: 类目兜底
名字: 用作者信息给冷门视频兜底

# 以前还治「新用户不会做」—— 这招是视频那一侧的借用，帮不到没见过的用户。
治哪些毛病: [冷门视频排不上去]
属于哪个环节: 特征

为什么管用: |
  冷门视频在训练数据里出现次数太少，它自己那份 embedding 根本学不出信息。
  但同一个作者的视频，受众和风格是相近的。所以当一条视频出现次数很少时，
  让它借用作者那一层的统计量顶一顶，相当于借用同一作者其它视频的经验。
  出现次数越少，借得越多。

  KuaiRand 的流水线里没有视频类目这一列，能当"类目"用的现成分组是 author_id
  （训练集里六千五百多个作者）。要说清楚：author_id 本来就作为基础字段进了模型，
  模型已经能靠它学到一部分作者层面的信息 —— 这张卡的增量在于**显式地**告诉模型
  "这是条冷门视频、该多信作者"，所以预计提升比别的特征卡小。

预计能提多少: {GAUC: 0.001, nDCG@5: 0.001}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.0}
前提条件: []
靠不靠谱: 0.6

怎么实现: |
  零件是现成的，只发 config_patch，不交文件：
  ```yaml
  features:
    类目兜底:
      enabled: true
      impl: modules/features/category_fallback.py
      item_field: video_id
      category_field: author_id
      output_field: 作者兜底热度
      K: 20
  ```
  借用比例 = 1 − min(1, 该视频训练集出现次数 / K)；K 从 20 开始试。
  零件输出"视频自己的出现次数"与"作者名下热门视频的平均出现次数"按借用比例的混合值。
  出现次数只能用训练集统计，不能碰验证集（R2）。

失败信号: |
  · 低频桶涨了但高频桶掉了 —— K 取太大，热门视频自己的信息被作者稀释了，把 K 调小。
  · 所有桶都没动 —— author_id 的 embedding 早就学到了这些；
    先看「按视频曝光次数分组」最低桶的占比，再决定要不要继续这条轴。
  · 冷门那一档反而更差 —— 检查借用比例的方向有没有写反（出现次数越少应该借得越多）。

出处: |
  冷启动场景下的表示共享，推荐系统常见做法
