# 来源：语料包 method_cards.md MC-12
# ⚠️ 这张卡有一条必须说清楚的纪律：负采样买到的是速度，不是分数。
#    任何声称"负采样提升了 GAUC / nDCG@5"的假设都是协议违规，直接打回。

编号: 负采样与概率校准
名字: 按用户降采样负例来提速

治哪些毛病: [训练太慢]
属于哪个环节: 数据 + 训练策略

为什么管用: |
  训练集 114 万行，long_view 的正例约占 34%，其余是负例。负例里有大量模型早就
  判得很准的易分样本，贡献了大部分计算量，却几乎不提供梯度。按比例丢掉一部分负例
  （正例全留），单轮训练时间会下降，等于在同样的时间预算里多跑几轮实验。

  ⭐ 必须诚实的两点：
  一、这招买到的是速度，不是分数。GAUC 和 nDCG@5 只看用户内的先后次序，
      采样对它们的直接贡献是 0，丢了数据甚至略微为负。
      也正因为只看次序，"采样后把概率还原回真实尺度"那一步在这里没有意义 ——
      还原是单调变换，不改变任何用户内的排序。
  二、34% 的正例率不算稀疏，能省的计算有限：负例砍一半，总行数只少三分之一。

预计能提多少: {GAUC: 0.0, nDCG@5: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 0.7}
前提条件:
  - 流水线得有能丢训练行的挂载点 —— 目前没有：加特征零件只能加列、不能删行，训练零件只在训练开始和每轮结束时被回调。没有这个挂载点，这张卡落不了地
  - 只对训练集做，验证集必须保持原始分布（否则评估失真）
靠不靠谱: 0.6

怎么实现: |
  按用户分组采样，不要全局采样：
    每个用户的正例全留，负例按比例 w 随机保留（w 从配置读）。
    全局采样会把曝光少的用户削到只剩正例 —— 用户内没有可排的对，
    GAUC 就直接不统计这个用户了。
  验证集绝对不做采样，永远在原始分布上评估。

失败信号: |
  · 有人报告"负采样让 GAUC 涨了 0.00X" —— 纯噪声，或者验证集也被采样了，先查再说。
  · 采样后曝光少的那批用户分数明显下降 —— 他们的负例被削光了，给每个用户留保底。
  · 单轮时间省下不到 20% —— 正例率本来就高，这条路在本数据集上收益有限，别再追。

出处: |
  He et al., "Practical Lessons from Predicting Clicks on Ads at Facebook",
  ADKDD 2014（Facebook 广告生产系统的负采样实践）
