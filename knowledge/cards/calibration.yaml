# 来源：语料包 method_cards.md MC-12
# 方向不受 Q2 影响：训练/后处理改动。
# ⚠️ 这张卡有一条必须说清楚的纪律：负采样买到的是速度，不是 AUC。
#    任何声称"负采样提升了 AUC"的假设都是协议违规，直接打回。

编号: 负采样与概率校准
名字: 降采样提速 + 把概率还原回去

治哪些毛病: [训练太慢, 把握不准]
属于哪个环节: 数据 + 训练策略

为什么管用: |
  曝光里只有约 4% 被点击、转化更是千分位，绝大多数样本是负样本。
  训练时这些易分负样本贡献了绝大部分计算量，却几乎不提供梯度信息 ——
  模型早就知道它们是负的了。把负样本按比例丢掉一部分（正样本全留），
  单轮训练时间能成倍下降，等于把总迭代轮数放大同样的倍数。

  代价是模型输出的概率被抬高了（它以为正样本比例比真实高），
  所以要用一个公式把概率还原回真实尺度。

  ⭐ 必须诚实的一点：AUC 只看排序，而还原公式是单调变换，不改变排序 ——
  所以负采样对 AUC 的直接贡献是 0（甚至因为丢了数据略微为负）。
  它换来的是速度，速度换来更多轮实验，实验才换来分数。
  校准本身对 LogLoss 有意义，对 AUC 没有。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 0.5}
前提条件:
  - 只对训练集做，验证集和锁定集必须保持原始分布（否则评估失真）
靠不靠谱: 0.6

怎么实现: |
  采样：
    正样本（click=1）全部保留，负样本按比例 w 随机保留（w 从配置读）。
    转化正样本极少，无论如何都要全留。
    官方 baseline 里已经有这个开关（--frac 参数，见 mlp_model.py 的 preprocess）。

  还原（预测阶段）：
    p_真实 = q / (q + (1 − q) / w)
    其中 q 是模型输出、w 是负样本保留比例。

  评估纪律：
    验证集绝对不做采样，永远在原始分布上评估。
    报 AUC 时用不用还原后的概率都一样（单调变换），但报 LogLoss 必须用还原后的。

  「把握不准」这个病可以直接用训练日志里现成的 LogLoss 判断，
  不用自己再算分档校准误差（见 docs/baseline笔记.md 第三节）。

失败信号: |
  · 有人报告"负采样让 AUC 涨了 0.00X" —— 协议违规或纯噪声，不予采纳。
    真涨了要去查是不是验证集也被采样了。
  · 采样后购买 AUC 大幅波动 —— 点击样本被削太狠，购买塔的训练样本不够了；
    提高 w，或对 click=1 的样本完全不采样。
  · LogLoss 在还原后反而更差 —— 还原公式里的 w 用错了（要用实际保留比例，
    不是目标比例）。

出处: |
  He et al., "Practical Lessons from Predicting Clicks on Ads at Facebook",
  ADKDD 2014（Facebook 广告生产系统的负采样与重校准实践）
