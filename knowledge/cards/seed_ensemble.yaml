# 来源：语料包 method_cards.md MC-14
# ⚠️ 这张卡有两个用途，触发时机完全不同：
#    用途一（噪声测量）—— 每个数据规模开跑前做一次，是所有阈值的标尺。
#    用途二（融合提分）—— 只在最后阶段做，早做会让归因变糊。

编号: 多种子平均与融合
名字: 先量噪声，最后融合

治哪些毛病: [结果不稳]
属于哪个环节: 训练策略 + 收尾

为什么管用: |
  同一份代码、同一份数据，只换随机种子，分数就会抖动。这个抖动幅度
  （噪声带）决定了"多大的提升才算真提升"—— 不先量出来，
  就会把噪声当进步、把真进步当噪声，这是自动迭代系统最隐蔽的失效模式。
  数据切得越小、每个用户的曝光越少，抖得越厉害 —— 所以每换一档数据规模都要重量。

  量完噪声之后，同一套快照还能顺手用来提分：把多个种子的预测平均，
  各自的随机误差会相互抵消，平均结果通常比任何单个种子都稳、都好。
  再进一步，把树模型和神经网络的预测混合 —— 两者的错误模式不同，
  互补性比同族模型之间更强。

预计能提多少: {GAUC: 0.002, nDCG@5: 0.002}
要花多少力气: {代码难度: 简单, 训练时间倍数: 3.0}
前提条件:
  - 噪声测量不是工兵的活：有现成命令 python -m agent.cli noise，由人在开跑前做，量出来的噪声带会自动被外层循环读到
  - 融合提分需要流水线能把几次训练的预测合起来 —— 目前没有这个挂载点
  - 融合只在时间预算剩余约 15% 时才解锁，早做会污染单点归因
靠不靠谱: 0.7

怎么实现: |
  用途一 · 噪声测量（开跑前）
    固定配置不动，只换 3 个随机种子各训一次，记录 GAUC、nDCG@5、主分各自的标准差。
    "算不算提升"的门槛、分组差距算不算病的门槛，都用它的倍数来定。
    升级数据规模后必须重测 —— 样本变多，噪声地板会下降，门槛要跟着收紧。

  用途二 · 终局融合（挂载点就位之后）
    种子平均：同一配置换 3~5 个种子训练，预测取平均。
    跨家族融合：最好的树模型 + 最好的神经网络。评测只看用户内次序，
                所以先在每个用户内部把各模型的分数转成排名，再按验证集主分加权平均 ——
                直接平均原始分数，尺度大的那个模型会说了算。
    所有参与融合的模型必须遵守同一套数据纪律，否则整个提交作废。

失败信号: |
  · 3 个种子的标准差超过 0.01 —— 数据规模太小，这一层的实验结论都不可信，
    先扩大数据量再谈优化。
  · 融合后不如最好的单模型 —— 成员之间相关性太高（比如都是同一个模型换种子），
    换更不相关的成员，或按验证分重新配权。
  · 中途就开始融合 —— 会让后续所有单点改动的归因变糊，日志读不懂。

出处: |
  融合是竞赛冠军方案的公开惯例；MLE-bench（arXiv:2410.07095）观察到
  Agent 的最好成绩常涉及集成/平均类操作
