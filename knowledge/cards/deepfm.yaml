# 来源：语料包 method_cards.md MC-05
# 方向不受 Q2 影响：这是骨干网络改动，与 CVR 去偏方法族无关。
# DeepFM 是官方 baseline 支持的三种骨干之一，换上去可以和官方数字直接对话。

编号: DeepFM
名字: 自动二阶特征交叉

治哪些毛病: [特征没组合起来]
属于哪个环节: 模型

为什么管用: |
  纯 MLP 把所有字段的 embedding 拼成一条长向量再往下压。理论上它能学出
  字段之间的乘性关系，实践中很难 —— 加法结构要用很多层才能凑出一次乘法。

  但推荐场景里最有用的信号恰恰是乘性的："这个用户 × 这个类目"才是决策依据，
  单看用户或单看类目都不够。DeepFM 在 MLP 旁边并联一个 FM 头，
  用 embedding 两两内积的方式，把所有字段对的二阶交叉一次性显式算出来，
  不需要人工指定哪两个字段该交叉。

预计能提多少: {点击AUC: 0.003, 购买AUC: 0.002}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.2}
前提条件:
  - 所有字段的 embedding 维度必须一致（FM 内积的硬性要求）
靠不靠谱: 0.55

怎么实现: |
  FM 头和深度塔共享同一份 embedding 表（这是 DeepFM 相对 Wide&Deep 的关键改进，
  省掉了人工特征工程）：
    FM 部分  = 一阶项（每个特征一个标量权重）+ 二阶项（所有字段对 embedding 内积求和）
    深度部分 = 现有的 MLP 塔
    最终 logit = FM 部分 + 深度部分，再过 sigmoid

  二阶项有个 O(F) 的化简写法，不要写成 O(F²) 的双重循环：
    0.5 × Σ_k [ (Σ_i v_ik)² − Σ_i v_ik² ]

  官方 baseline 里有现成实现可参考：
  torch-rechub/torch_rechub/models/multi_task/ 下的 DeepFM4MMOE。

失败信号: |
  · 相比纯 MLP 提升不到噪声带 —— 可能是目标编码那张卡已经把主要交叉信息
    喂进去了，两张卡的收益重叠；不要再叠更多交叉变体，换轴。
  · 训练不稳定/loss 震荡 —— FM 一阶项和深度部分的量级差太多，
    检查 embedding 初始化尺度。

出处: |
  Guo et al., "DeepFM: A Factorization-Machine based Neural Network for
  CTR Prediction", IJCAI 2017（华为，应用市场场景验证）；
  FM 理论基础：Rendle, ICDM 2010
