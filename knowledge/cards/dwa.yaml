# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」

编号: DWA
名字: 动态权重平均

治哪些毛病: [两个任务打架]
属于哪个环节: 训练策略

为什么管用: |
  和 DTP 想法接近，但不看分数、只看"损失下降得快不快"。
  某个任务的损失最近降得慢，说明它卡住了，就给它加权重；
  降得快说明还在顺利学，权重可以让一让。
  好处是不用算 AUC，没有"batch 里没有正样本"的麻烦，几乎不增加开销。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 至少要跑满 3 个 epoch 才开始生效（前两轮没有历史损失可比）
  - 需先观察到两个任务的分数一涨一跌
靠不靠谱: 0.5

怎么实现: |
  参考实现：NISE repo mtl_trainer.py:305
  w_i = softmax([loss_i(t-1) / loss_i(t-2) for i in tasks] / T)，T=2.0
  前两个 epoch 退化成 1:1 等权。
  温度 T 要进配置（R7），baseline 写死的 2.0 是论文默认值。
  补充：
    直觉：看每个任务的损失"下降得快不快"，下降慢的说明学得吃力，给它更大权重。
    比值用的是相邻两轮的损失比（t-1 除以 t-2），所以前两轮没有历史，退化成等权。
    温度 T 控制权重分化的程度：T 越大越接近等权，T 越小差异越极端。
    ⭐ 损失比值对噪声敏感，建议用 epoch 级的平均损失而不是单 batch 的，
    否则权重会一轮一个样。

失败信号: |
  · 权重一轮一个样 —— 用的是 batch 级损失比值，改成 epoch 级平均。
  · 温度调小后某个任务被完全压制 —— T 太小，回调；或改用不确定性加权（有正则项兜底）。
  · 提升不到噪声带 —— 等权本来就接近最优，这条轴到此为止。

出处: |
  2019《End-to-End Multi-Task Learning with Attention》(CVPR)。
  NISE repo 参考了 auto-lambda 仓库的实现
