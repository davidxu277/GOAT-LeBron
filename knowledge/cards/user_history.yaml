# 取代 AliCCP 时代的「多值字段接回来」—— KuaiRand 没有多值字段，
# 用户历史得自己从训练日志里拼出来。

编号: 用户历史序列
名字: 把用户"之前看完过什么"做成特征

治哪些毛病: [历史行为没用上]
属于哪个环节: 特征

为什么管用: |
  现在进模型的只有当次曝光自己的字段（user_id、video_id、author_id、tab、时长分桶），
  用户过去看过什么、看完了什么，一点都没进来 —— 模型只能靠 user_id 那一份 embedding
  把一个人两周的行为硬记下来。训练集里用户的中位数是 31 次曝光、约 10 次看完，
  这些信息是现成的，只是没接进来。

  最直接的一类：这个用户过去对**同一个作者**、**同一个 tab** 的视频看完的比例。
  它回答的正是评测在问的问题 —— "在这个用户自己的候选里，哪一条他更可能看完"。
  这也是官方 Starter Kit 排第 2 的 headroom 方向（用户历史序列建模）。

预计能提多少: {GAUC: 0.004, nDCG@5: 0.004}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.1}
前提条件: []
靠不靠谱: 0.7

怎么实现: |
  写一个加特征零件（modules/features/ 下的新文件），fit 只看训练集：
    交叉统计 —— (user_id, author_id)、(user_id, tab) 两组，各算：
                  过去曝光次数、过去看完次数、平滑后的看完率
                  平滑：(看完次数 + α × 该用户整体看完率) / (曝光次数 + α)，α 从配置读
    标签在流水线里的列名是 label（就是 long_view），别按 long_view 去取。

  ⭐ 时间纪律 —— 这张卡最容易出错的地方：
    · 训练集的每一行，只能用**严格早于它那一天**的行来算。
      数据里只有 date，没有同一天内的先后，所以同一天的行一律不许互相看。
    · 验证集用整个训练集算（训练期全部早于验证期）。
    · 用了"当天及以后"的行 = 把答案抄给模型，训练分会虚高。

  看完率这种连续值直接输出成小数就行，流水线会按训练集分位数自动分档。
  新列会自动进特征表，不用改 base_fields。

失败信号: |
  · 训练集主分暴涨、验证集没动 —— 时间纪律写错了，训练行看到了自己当天的标签。
  · 验证集单步涨超过 0.02 —— 同上，先审计再庆祝。
  · 完全没动 —— 先看成绩单「实际特征」里新列有没有真的进去；进去了还没动，
    说明 user_id 的 embedding 已经记住了这些，下一步换「DIN注意力池化」。

出处: |
  官方 KuaiRand Starter Kit 的 headroom 分析；Covington et al., "Deep Neural Networks
  for YouTube Recommendations", RecSys 2016（用观看历史作为特征）
