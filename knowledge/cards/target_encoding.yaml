# 来源：语料包 method_cards.md MC-02
# ⚠️ 这是全卡库里最容易造成标签泄漏的一张，「怎么实现」里的折外纪律不许省。

编号: 目标编码
名字: 用训练期的看完率给 ID 编码

治哪些毛病: [冷门视频排不上去, 新用户不会做]
属于哪个环节: 特征

为什么管用: |
  模型给每个 ID 学一份 embedding，但各个 ID 的样本量极不均匀 ——
  训练集 7538 个视频里约 14% 曝光不到 10 次，这些视频的 embedding 等于随机向量。

  这招换一个角度：不让模型自己学，而是直接告诉它"这个 ID 在训练期被看完的比例"。
  哪怕一条视频只曝光过 8 次，这 8 次里的看完率也比一份没学好的 embedding 更有信息量。
  对新用户也有用：新用户自己的 embedding 是空的，但他候选里每条视频的看完率是现成的，
  至少能按"大家都爱看完的排前面"来排。

  代价是这招用到了标签，所以必须折外计算 —— 否则就是把答案抄给模型。

预计能提多少: {GAUC: 0.004, nDCG@5: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.1}
前提条件: []
靠不靠谱: 0.6

怎么实现: |
  现成零件 modules/features/target_encoding.py 已经把折外纪律写好了，配置长这样：
  ```yaml
  features:
    目标编码:
      enabled: true
      impl: modules/features/target_encoding.py
      fields: [video_id, author_id]
      smoothing: 20
      n_folds: 5
      target_col: label
  ```
  编码值 = (该 ID 的看完次数 + α × 全局看完率) / (该 ID 出现次数 + α)，α 就是 smoothing。

  直接挂就行，不用自己分档：编码值是连续的小数，流水线会按训练集分位数
  自动切档（档数是 model.deep.numeric_bins），训练集和验证集落进同一套档里。
  成绩单「训练诊断 → 每轮训练记录 → 自动分档的列」里能看到它有没有被分档。

  ⭐ 折外纪律（违反即泄漏，R2）：
    把训练集切成 K 折，算第 k 折样本的编码值时，只能用其余 K−1 折的统计量。
    验证集用整个训练集的统计量。
    绝对不能用"包含这条样本自己"的统计量去编码这条样本 ——
    那等于直接把它的标签除以 1 告诉模型。
  没见过的 ID 一律回退到全局先验值。

失败信号: |
  · 验证集主分单步跳涨超过 0.02 —— 几乎可以肯定是折外纪律写错了，先审计再说。
  · 训练集分数很高、验证集没动 —— 同上，典型的折内泄漏症状。
  · 验证集纹丝不动 —— 先看「自动分档的列」里有没有它；有，而且还是没提升，
    说明模型已经通过 embedding 学到了同样的信息，这条轴到此为止。

出处: |
  Micci-Barreca, "A preprocessing scheme for high-cardinality categorical
  attributes", SIGKDD Explorations 2001；Kaggle CTR 类竞赛高频冠军技术
