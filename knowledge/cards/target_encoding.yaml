# 来源：语料包 method_cards.md MC-02
# 方向不受 Q2 影响：特征侧改动。
# ⚠️ 这是全卡库里最容易造成标签泄漏的一张，「怎么实现」里的折外纪律不许省。

编号: 目标编码
名字: 用历史转化率给高基数 ID 编码

治哪些毛病: [冷门商品学不动, 新用户不会做]
属于哪个环节: 特征

为什么管用: |
  用户 ID、商品 ID 都是百万量级的高基数离散特征。模型给每个 ID 学一份 embedding，
  但出现次数少的 ID 根本没有足够样本把它学出来 —— 长尾部分等于随机向量。

  这招换一个角度：不让模型自己学，而是直接告诉它"这个 ID 历史上的点击率是多少、
  出现过多少次"。哪怕一个商品只出现过 8 次，这 8 次里的点击率也比一份没学好的
  embedding 更有信息量。没见过的新 ID 则回退到全局平均，至少不会是噪声。

  代价是这招用到了标签，所以必须折外计算 —— 否则就是把答案抄给模型。

预计能提多少: {点击AUC: 0.004, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.1}
前提条件: []
靠不靠谱: 0.6

怎么实现: |
  两种编码，建议都做：
    频率编码 —— 把 ID 替换成它在训练集里的出现次数（取 log 后更稳）。
                 不涉及标签，没有泄漏风险，先做这个。
    目标编码 —— 把 ID 替换成它历史上的平滑点击率/转化率：
                 编码值 = (该 ID 的正样本数 + α × 全局正样本率) / (该 ID 出现次数 + α)
                 α 是平滑强度，从配置读，建议从 20 起步。

  ⭐ 折外纪律（违反即泄漏，R2）：
    把训练集切成 K 折，算第 k 折样本的编码值时，只能用其余 K−1 折的统计量。
    验证集和测试集用整个训练集的统计量。
    绝对不能用"包含这条样本自己"的统计量去编码这条样本 ——
    那等于直接把它的标签除以 1 告诉模型。

  没见过的 ID（验证集里的新 ID）一律回退到全局先验值。

失败信号: |
  · 验证集 AUC 单步跳涨超过 0.02 —— 几乎可以肯定是折外纪律写错了，
    先审计再说，不要当成提升采纳（failure_recovery_kb B 区）。
  · 训练集分数很高、验证集没动 —— 同上，典型的折内泄漏症状。
  · 完全没提升 —— 模型可能已经通过 embedding 学到了同样的信息，
    这条轴到此为止，换轴。

出处: |
  Micci-Barreca, "A preprocessing scheme for high-cardinality categorical
  attributes", SIGKDD Explorations 2001；Kaggle CTR 类竞赛高频冠军技术
