# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」

编号: DR
名字: 双重稳健（ESCM²-DR）

治哪些毛病: [转化样本偏差, 结果不稳]
属于哪个环节: 损失函数

为什么管用: |
  IPS 那招有个毛病：分母（预测点击概率）一旦估得不准，权重就会大得离谱，
  分数忽高忽低。这招加了第二道保险 —— 另外训一个小模型，
  专门预测"这条样本如果被点了，损失大概是多少"，
  然后用它去补上没被点的那些样本。
  两道保险只要有一道是准的，结果就是对的，所以叫"双重稳健"。
  代价是多了一个要训的小模型。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 难, 训练时间倍数: 1.8}
前提条件:
  - 需先确认官方 baseline 不是 NISE（见 docs/baseline笔记.md 第零节 Q2）
  - 建议先试 IPS —— DR 是 IPS 的加固版，IPS 没效果时 DR 大概率也没有
靠不靠谱: 0.5

怎么实现: |
