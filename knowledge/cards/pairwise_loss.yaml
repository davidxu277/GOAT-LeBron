编号: pairwise_loss
名字: 用户内 Pairwise 排序损失

治哪些毛病: [排序损失不匹配, Top5排不上去]
属于哪个环节: 训练策略

为什么管用: |
  评测是用户内排序：GAUC 问的是"同一个用户的一对视频，看完的那条是不是排在前面"，
  nDCG@5 问的是"看完的那几条有没有进前 5"。
  而现在的训练目标是逐条 BCE —— 每条曝光单独判"会不会看完"，
  分数的绝对值学得再准，同一个用户内部的相对次序也未必对。
  Pairwise 损失直接在同一用户内构造（看完的, 没看完的）对，惩罚排反了的对，
  训练目标和 GAUC 的定义几乎是同一件事。

预计能提多少: {GAUC: 0.008, nDCG@5: 0.008}
要花多少力气: {代码难度: 中等, 训练时间倍数: 2.0}
前提条件:
  - 流水线要让模型零件自带的损失生效 —— 目前不生效：KuaiRand 的训练循环总是用任务自带的逐条 BCE，模型零件里写的 loss 方法会被静默忽略（任务损失的优先级更高）。没有这个挂载点，这张卡落不了地
靠不靠谱: 0.7

怎么实现: |
  挂载点就位之后：
    每个批次内，找出同一用户的（long_view=1, long_view=0）对，
    损失 = −log σ(s_正 − s_负)，对所有对取平均。
    随机打乱的 8192 行批次里平均能凑出约 900 个这样的对，够起步，不用先改批次；
    想要更多对，再改成按用户整组取样的批次。
    建议和原来的 BCE 加权相加（权重从配置读）—— 纯 pairwise 会丢掉分数的尺度信息。
  只在训练集里构造对，验证集照常逐条打分。

失败信号: |
  · 训练耗时显著上升，但验证集主分提升不到 0.002 —— 对太稀，改成按用户组织批次。
  · GAUC 涨了而 nDCG@5 没动 —— pairwise 优化的是整体次序，想推前 5 要换 listwise
    （如按 ΔNDCG 给每个对加权的 LambdaRank）。
  · 分数没有任何变化 —— 先看「改动是否生效」；未生效说明损失没接上，是挂载点的问题，
    不是这招没用。

出处: |
  Rendle et al., "BPR: Bayesian Personalized Ranking from Implicit Feedback", UAI 2009
