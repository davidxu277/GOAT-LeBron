# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」
# 靠不靠谱 = 0.5 是中性先验，等复盘官按实验结果更新，不是拍的"估计值"

编号: MMOE
名字: 多门控专家混合

治哪些毛病: [两个任务打架]
属于哪个环节: 模型

为什么管用: |
  点击和购买是两件不完全一样的事。共用一个底座时，
  两个任务会抢同一批参数 —— 一个学好了另一个就退步。
  这招不再共用一个底座，而是准备几个"专家"底座，
  再给每个任务配一个"门"，由门自己决定这次要听哪几个专家的、各听多少。
  两个任务想学不一样的东西时可以各走各的路，想共享时门会自动重叠。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.3}
前提条件:
  - 需先确认官方 baseline 不是 NISE（见 docs/baseline笔记.md 第零节 Q2）
  - 需先观察到两个任务的分数一涨一跌，否则没有换模型的理由
靠不靠谱: 0.5

怎么实现: |
  参考实现：NISE repo
  torch-rechub/torch_rechub/models/multi_task/mmoe.py
  baseline 的参数：2 个专家，专家 dims=[80]，每个塔 dims=[40]
  补充：
    门控就是一个 softmax 线性层（输入是共享的 embedding 拼接，输出维度 = 专家数）。
    专家个数、专家维度、塔维度全部从配置读（R7），不许照抄 baseline 的写死值。
    ⭐ 公平比较纪律：换上 MMoE 时总参数量要和被替换的 shared-bottom 大致持平，
    否则分不清提升来自"门控解耦"还是单纯"参数变多"。
    建议记一个诊断量：每个任务的门控权重分布。两个任务的分布如果几乎一样，
    说明门控没起作用，这招在这份数据上就是无效的。

失败信号: |
  · 参数量对齐后提升不到噪声带 —— 退回 shared-bottom，别在混合证据上采纳更复杂的结构。
  · 两个任务的门控权重分布几乎重合 —— 门控没有起到解耦作用，
    换梯度层面的方案（DTP / DWA / 不确定性加权）而不是继续堆专家。
  · 购买 AUC 训练涨、验证跌 —— 专家参数太多而转化正样本太少，缩小专家维度。

出处: |
  Google 2018《Modeling Task Relationships in Multi-task Learning with
  Multi-gate Mixture-of-Experts》(KDD)。NISE 论文的对照组之一
