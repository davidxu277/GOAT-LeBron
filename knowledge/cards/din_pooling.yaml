# 来源：语料包 06_论文综述 §6.1（优先级 A）

编号: DIN注意力池化
名字: 按当前视频加权聚合用户看过的视频

治哪些毛病: [历史行为没用上]
属于哪个环节: 特征 + 模型

为什么管用: |
  「用户历史序列」那张卡把用户过去的行为做成了统计特征，但统计（次数、看完率）
  等于认为"用户看过的每一条，对当前这次曝光同等重要"。
  这显然不对：一个既看美食又看游戏的用户，面对一条游戏视频时，
  他看完过的美食视频对这次判断几乎没有价值。

  这招的做法是：拿当前曝光的视频（它的作者、tab）作为"提问的人"，
  去问用户最近看完过的每一条"你和我像不像"，像的权重给高、不像的给低，
  再按这个权重聚合。同一个用户面对不同视频时，被激活的历史是不一样的 ——
  用户兴趣是多样的，但每次决策只用得上其中一部分。

预计能提多少: {GAUC: 0.002, nDCG@5: 0.003}
要花多少力气: {代码难度: 困难, 训练时间倍数: 1.5}
前提条件:
  - 先做「用户历史序列」那张卡，确认用户历史这条路本身有效
  - 流水线要支持两个字段共用一张词表 —— 目前不支持：每个字段各自编号，「历史里的第 3 个作者」和「当前视频的作者」落在两套不同的下标里，模型零件没法让它们共享 embedding，注意力里的"像不像"就无从算起
靠不靠谱: 0.6

怎么实现: |
  挂载点就位之后，以作者为例：
    1. 当前曝光视频 author_id 的 embedding 作为 query
    2. 用户最近 L 条看完过的视频（严格早于当前日期）各自作者的 embedding 作为 key
    3. 把 [query, key, query−key, query*key] 拼起来过一个小 MLP，输出一个标量
    4. 按这些标量加权求和，得到用户面向当前视频的兴趣向量，和其它特征拼在一起进主网络
  tab 同理，可以和作者共享一套注意力参数，从共享开始试。
  历史不足 L 条的空位要在注意力里屏蔽掉，不能当成一个真的作者。
  L、小 MLP 的隐层维度都从配置读（R7）。

  挂载点就位之前的退路：在特征零件里先算好"当前视频的作者在用户最近 L 条
  看完的历史里出现过几次"，分档后当普通类别特征进模型。
  这是注意力的一个很粗的近似，但今天就能落地。

失败信号: |
  · 相比「用户历史序列」没有提升 —— 训练集里用户中位数只有 31 次曝光、约 10 次看完，
    历史本来就短，注意力没有发挥空间；先看历史长度分布再决定要不要继续这条轴。
  · 训练时间涨了 2 倍以上 —— 注意力算的是每条历史 × 每个候选，检查 L 有没有截断。
  · 过拟合加重（训练/验证差距变大）—— 注意力 MLP 参数太多，缩小隐层。

出处: |
  Zhou et al., "Deep Interest Network for Click-Through Rate Prediction", KDD 2018,
  arXiv:1706.06978（阿里妈妈，淘宝展示广告线上部署多年）
