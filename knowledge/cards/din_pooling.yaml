# 来源：语料包 06_论文综述 §6.1（优先级 A，建议蒸馏为 MC-20）
# 方向不受 Q2 影响：这是特征侧改动，与 baseline 是谁无关。

编号: DIN注意力池化
名字: 按当前商品加权聚合用户历史行为

治哪些毛病: [历史行为没用上]
属于哪个环节: 特征 + 模型

为什么管用: |
  用户历史行为字段（逛过的类目、店铺、品牌）如果只做简单的求和或平均，
  等于认为"用户逛过的每一样东西，对当前这次曝光同等重要"。
  这显然不对：一个既买母婴又买数码的用户，在看一台相机时，
  他逛过的母婴类目对这次判断几乎没有价值。

  这招的做法是：拿当前曝光商品作为"提问的人"，让它去问用户的每一条历史行为
  "你和我像不像"，像的权重给高、不像的权重给低，再按这个权重聚合。
  同一个用户面对不同商品时，被激活的历史是不一样的 —— 用户兴趣是多样的，
  但每次决策只用得上其中一部分。

预计能提多少: {点击AUC: 0.003, 购买AUC: 0.003}
要花多少力气: {代码难度: 中等, 训练时间倍数: 1.3}
前提条件:
  - 多值字段必须已经接进模型（先做「多值字段接回来」那张卡）
靠不靠谱: 0.6

怎么实现: |
  以类目为例（109_14 用户历史类目 vs 206 当前商品类目）：
    1. 取当前商品类目的 embedding 作为 query
    2. 对用户历史里的每个类目 embedding 作为 key，
       把 [query, key, query−key, query*key] 拼起来过一个小 MLP，输出一个标量
    3. 这些标量做 softmax（或直接用原始分数，DIN 原文不做归一化）得到权重
    4. 按权重对历史 embedding 加权求和，得到这个用户面向当前商品的兴趣向量

  店铺（110_14 vs 207）、品牌（127_14 vs 216）、意图（150_14 vs 210）同理，
  四组可以共享同一套注意力 MLP 参数，也可以各自独立 —— 从共享开始试。

  小 MLP 的隐层维度必须从配置读（R7）。

失败信号: |
  · 相比简单加权平均池化没有提升 —— 可能是历史序列太短（多数用户只有几个行为），
    注意力没有发挥空间；先看历史长度分布再决定要不要继续这条轴。
  · 训练时间涨了 2 倍以上 —— 注意力算的是每条历史 × 每个候选，
    检查是不是没有对历史长度做截断。
  · 过拟合加重（训练/验证差距变大）—— 注意力 MLP 参数太多，缩小隐层。

出处: |
  Zhou et al., "Deep Interest Network for CTR Prediction", KDD 2018,
  arXiv:1706.06978（阿里妈妈，淘宝展示广告线上部署多年）
