# 骨架由成员3 从 NISE 源码整理，成员2 补「怎么实现」

编号: IPS
名字: 倾向得分加权（ESCM²-IPS）

治哪些毛病: [转化样本偏差]
属于哪个环节: 损失函数

为什么管用: |
  只有被点过的商品才能看到"买没买"。而容易被点的商品在训练里出现得多，
  不容易被点的出现得少 —— 模型于是被那批"容易被点的"带偏。
  这招给每条样本一个补偿权重：越不容易被点的样本，一旦被点了就越金贵，
  权重给得越大。相当于把被采样歪掉的分布掰回来。
  权重 = 真实点击 ÷ 模型预测的点击概率。

预计能提多少: {点击AUC: 0.0, 购买AUC: 0.0}
要花多少力气: {代码难度: 简单, 训练时间倍数: 1.0}
前提条件:
  - 需先确认官方 baseline 不是 NISE（见 docs/baseline笔记.md 第零节 Q2）
  - 点击塔要先训得像样，否则分母不可信，权重会炸
靠不靠谱: 0.5

怎么实现: |
  TODO 成员2 填。参考实现：NISE repo
  torch-rechub/torch_rechub/trainers/mtl_trainer.py 的 IPS 分支
  核心一行：weight = ys[:, 1] / y_preds[:, 1]   # 真实点击 / 预测点击
  注意分母要 clip，NISE 用的是 [1e-15, 1-1e-15]

出处: |
  阿里 2022《ESCM²: Entire Space Counterfactual Multi-Task Model》(SIGIR)。
  NISE 论文的对照组之一
