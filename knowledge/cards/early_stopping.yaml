# 来源：语料包 method_cards.md MC-13 的训练纪律部分 + 06_论文综述 §5 训练技巧
# 这张卡有配套代码范文：modules/train/early_stopping.py

编号: 早停与训练轮次
名字: 用验证集控制该训多久

治哪些毛病: [在背题, 学得不够]
属于哪个环节: 训练策略

为什么管用: |
  训练轮次太少，模型还没学完就停了（欠拟合）；太多，模型开始背训练集里的
  个例而不是学规律（过拟合）。这两种病的表现完全相反，但根子是同一个旋钮。

  早停的做法是每轮结束后在验证集上评一次分，分数连续若干轮没有变好就停下，
  并回滚到最好的那一版权重。patience 给够，就不会过早停；
  一旦开始过拟合，也不会继续往下跑。

  ⚠️ 先看清当前流水线，别重复开：
    · 出厂配置里早停**已经开着**（「当前流水线」那一段的 train.early_stopping）
    · "回滚到最好的那一轮"训练循环自己就会做，不靠这个零件
  所以这张卡能做的是**调旋钮**：总轮数（model.deep.epochs）、patience、min_delta。

预计能提多少: {GAUC: 0.001, nDCG@5: 0.001}
要花多少力气: {代码难度: 改配置, 训练时间倍数: 1.0}
前提条件:
  - 只看验证集做决定，测试集全程不碰（R3、R9）
靠不靠谱: 0.65

怎么实现: |
  零件是现成的（modules/train/early_stopping.py），出厂已经挂好 ——
  只发 config_patch，不交文件。config_patch 是深度合并的，只写要改的键：
  ```yaml
  model:
    deep:
      epochs: 20
  train:
    early_stopping:
      patience: 5
  ```
  怎么调：
    学得不够（成绩单里最佳轮次 == 最后一轮）→ 加大 model.deep.epochs，patience 不动
    最佳轮次总在前两轮 → 学习率太大，改 model.deep.learning_rate，别动轮次
  monitor 只能填训练循环每轮真的产出的指标名 —— 工兵的提示里有这份清单，
  是从成绩单派生的，照那份填，别凭记忆写。
  min_delta（多小的提升算提升）和 CLAUDE.md R11 的门槛对齐。

失败信号: |
  · 最佳轮次总是等于最后一轮 —— 不是过拟合，是根本没训完（「学得不够」），
    加大总轮数或 patience，别去加正则。
  · 最佳轮次总是第 1~2 轮 —— 学习率太大或模型太复杂，先降学习率。
  · 改完 patience 分数纹丝不动 —— 先看成绩单「改动是否生效」；最佳轮次没变的话，
    早停根本没在它起作用的那个范围里触发。

出处: |
  早停即正则化是教科书结论（Goodfellow et al., Deep Learning, 2016）
