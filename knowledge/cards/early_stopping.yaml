# 来源：语料包 method_cards.md MC-13 的训练纪律部分 + 06_论文综述 §5 训练技巧
# 方向不受 Q2 影响：训练过程改动。
# ⚠️ 特别注意：官方 baseline 是拿 test 做早停的（docs/baseline笔记.md 洞 2）。
#    我们绝不能照抄 —— 早停只能看开发集，锁定集全程不碰（R3、R9）。
# 这张卡有配套代码范文：modules/train/early_stopping.py

编号: 早停与训练轮次
名字: 用开发集控制该训多久

治哪些毛病: [在背题, 学得不够]
属于哪个环节: 训练策略

为什么管用: |
  训练轮次太少，模型还没学完就停了（欠拟合）；太多，模型开始背训练集里的
  个例而不是学规律（过拟合）。这两种病的表现完全相反，但根子是同一个旋钮。

  早停的做法是每轮结束后在开发集上评一次分，分数连续若干轮没有变好就停下，
  并回滚到最好的那一版权重。它同时管住两头：patience 给够，就不会过早停；
  一旦开始过拟合，也不会继续往下跑。

  这个数据集上它格外重要 —— 转化正样本是千分位，购买塔的参数量相对样本量很大，
  过拟合几乎是默认结局。

  ⚠️ 官方 baseline 在这里有个洞：它的"验证集"传的其实是 test，
  等于按测试集分数选权重。我们照抄的话，本地分数会虚高、隐藏测试集上必掉。

预计能提多少: {点击AUC: 0.002, 购买AUC: 0.003}
要花多少力气: {代码难度: 简单, 训练时间倍数: 0.9}
前提条件:
  - 必须已经从训练集切出开发集（不是复用测试集，见 CLAUDE.md R3）
靠不靠谱: 0.65

怎么实现: |
  参考实现见 modules/train/early_stopping.py（这是给工兵的训练类范文）。

  要点：
    盯哪个指标 —— 官方 baseline 盯的是购买 AUC（task 0）。我们两个指标等权计分，
                   建议盯两个 AUC 的平均，或者分别记录、按当轮目标选。
                   盯哪个必须从配置读，不许写死。
    patience   —— 从 3 起步。patience 太小是"学得不够"的常见成因；
                   如果日志显示最佳轮次总是等于最后一轮，说明 patience 或
                   总轮数给少了，先加大再谈别的。
    回滚       —— 停下时必须把权重恢复到最佳那一轮，不是用最后一轮。
                   这一步最容易漏，漏了等于白早停。

  min_delta（多小的提升算提升）建议和 R11 的门槛对齐，从配置读。

失败信号: |
  · 最佳轮次总是等于最后一轮 —— 不是过拟合，是根本没训完（「学得不够」），
    加大总轮数或 patience，别去加正则。
  · 最佳轮次总是第 1~2 轮 —— 学习率太大或模型太复杂，先降学习率。
  · 早停后回滚了权重，分数却比不回滚更差 —— 检查回滚逻辑是不是存错了 epoch。

出处: |
  早停即正则化是教科书结论（Goodfellow et al., Deep Learning, 2016）；
  baseline 的早停配置见 NISE baselines/mlp_model.py（patience=3，盯 task 0）
