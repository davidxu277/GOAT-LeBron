[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-goat-bridge"
version = "0.1.0"
description = "Official KuaiRand-Pure data/evaluation boundary for GOAT-LeBron"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
