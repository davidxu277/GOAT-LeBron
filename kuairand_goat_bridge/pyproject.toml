[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-goat-bridge"
version = "0.1.0"
description = "Official KuaiRand-Pure data/evaluation boundary for GOAT-LeBron"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
goat = [
  "openai>=1.0",
  "anthropic>=0.75",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
