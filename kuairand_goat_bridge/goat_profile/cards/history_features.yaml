编号: history_features
名字: 用户历史兴趣特征
治哪些毛病: [用户历史未使用, 冷门视频排序不足]
属于哪个环节: 特征工程
为什么管用: 用户历史中看过的视频、作者和反馈能表达短期及长期兴趣，帮助同一用户的视频排序。
预计能提多少: {点击AUC: 0.01, 购买AUC: 0.01}
要花多少力气: {代码难度: 难, 训练时间倍数: 3.0}
前提条件: [历史只能由当前曝光日期之前的Train行为构造]
靠不靠谱: 0.75
怎么实现: 新增Train-only历史聚合或序列编码，并保证Validation与Test只套用已拟合状态。
失败信号: 出现时间泄漏，或未见用户占比导致性能下降。
出处: DIN/SIM user behavior modeling
