data_dir: /path/to/KuaiRand-Pure/data
trainer: examples/official_fm_trainer.py
output_dir: output/full_run

seed: 0

# 总训练尝试的硬上限。包括第0轮、Agent实验、重测和最终训练。
max_iterations: 50

epsilon: 0.002
patience: 3
max_wall_seconds: 21600
token_budget: 2000000
generate_test_after_convergence: true

official_baseline:
  validation:
    GAUC: 0.6674
    nDCG@5: 0.5357
    primary: 0.6016
  hidden_test:
    GAUC: 0.6610
    nDCG@5: 0.5282
    primary: 0.5946
  reproduction_tolerance: 0.003

# GOAT LLM credentials are read from its normal environment, for example:
# DEEPSEEK_API_KEY / ANTHROPIC_API_KEY.
